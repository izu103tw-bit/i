<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>緋刃浪人・孤狼：修羅極限 - 繪卷重製版</title>
<style>
  :root {
    --bg-washi: #F4F0E8;
    --ink-black: #1A1817;
    --sumi-deep: #2A2624;
    --crimson: #FF1037;
    --cyan: #00F5FF;
    --gold: #E5B239;
    --border-ink: #2D2723;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    font-family: 'Yu Mincho', 'Hiragino Mincho ProN', 'Songti TC', 'Noto Serif TC', serif;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-washi);
    color: var(--ink-black);
  }
  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, #FDFBF7 0%, #ECE6D8 100%);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* HUD */
  #hud-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .hud-top {
    position: absolute;
    top: 14px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .vitals-box {
    display: flex;
    flex-direction: column;
    gap: 7px;
    width: min(290px, 45vw);
    background: rgba(255, 253, 249, 0.88);
    padding: 12px 16px;
    border: 2px solid var(--border-ink);
    box-shadow: 4px 4px 0 rgba(45,39,35,0.85);
    backdrop-filter: blur(4px);
  }
  .bar-container {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .bar-bg {
    flex: 1;
    height: 9px;
    background: #DDD5C7;
    border: 1px solid var(--border-ink);
    position: relative;
    overflow: hidden;
  }
  .bar-fill-hp {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #D41434, var(--crimson));
    box-shadow: 0 0 8px rgba(255, 16, 55, 0.6);
    transition: width 0.15s ease-out;
  }
  .bar-fill-stam {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #00A6B4, var(--cyan));
    box-shadow: 0 0 8px rgba(0, 245, 255, 0.6);
    transition: width 0.1s ease-out;
  }
  .bar-fill-ult {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #C29623, #FFE685);
    box-shadow: 0 0 8px rgba(229, 178, 57, 0.6);
    transition: width 0.15s ease-out;
  }

  .center-status {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(255, 253, 249, 0.9);
    padding: 6px 20px;
    border: 2px solid var(--border-ink);
    box-shadow: 4px 4px 0 var(--border-ink);
  }
  .game-timer {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
  }
  .hud-score-label {
    font-size: 12px;
    font-weight: 900;
    color: var(--crimson);
    letter-spacing: 1px;
  }

  .exp-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: rgba(0,0,0,0.08);
  }
  .exp-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--crimson));
    transition: width 0.12s;
  }
  .level-badge {
    position: absolute;
    top: 10px;
    right: 20px;
    background: rgba(255, 253, 249, 0.95);
    border: 2px solid var(--border-ink);
    padding: 7px 16px;
    font-size: 15px;
    font-weight: 900;
    box-shadow: 4px 4px 0 var(--border-ink);
  }

  #boss-banner {
    position: absolute;
    top: 75px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(26, 24, 23, 0.92);
    color: #FFF;
    border: 2px solid var(--crimson);
    padding: 8px 24px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    width: min(360px, 85vw);
    box-shadow: 0 4px 20px rgba(255, 16, 55, 0.45);
  }
  #boss-hp-bar {
    width: 100%;
    height: 8px;
    background: #333;
    border: 1px solid #777;
  }
  #boss-hp-fill {
    width: 100%;
    height: 100%;
    background: var(--crimson);
  }

  /* UPGRADE MODAL */
  #upgrade-modal {
    position: absolute;
    inset: 0;
    background: rgba(240, 236, 227, 0.86);
    backdrop-filter: blur(6px);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 16px;
  }
  .upgrade-title {
    font-size: 28px;
    font-weight: 900;
    margin-bottom: 22px;
    letter-spacing: 5px;
    position: relative;
    padding-bottom: 8px;
  }
  .upgrade-title::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 3px;
    background: var(--crimson);
  }
  .cards-deck {
    display: flex;
    flex-wrap: wrap;
    gap: 18px;
    justify-content: center;
    max-width: 960px;
    width: 100%;
  }
  .ema-card {
    background: #FFFDF9;
    border: 3px solid var(--border-ink);
    box-shadow: 6px 6px 0 var(--border-ink);
    width: 280px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    pointer-events: auto;
    position: relative;
  }
  .ema-card:hover {
    transform: translateY(-6px);
    box-shadow: 8px 10px 0 var(--crimson);
    border-color: var(--crimson);
  }
  .preview-box {
    width: 100%;
    height: 110px;
    background: #ECE6D8;
    border: 1px solid #C5BBAA;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
  }
  .preview-canvas {
    width: 100%;
    height: 100%;
  }
  .card-type-tag {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 11px;
    padding: 3px 8px;
    font-weight: 900;
    background: var(--border-ink);
    color: #FFF;
  }
  .card-name {
    font-size: 18px;
    font-weight: 900;
    margin-bottom: 6px;
    color: var(--ink-black);
  }
  .card-desc {
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
    color: #4A443E;
  }

  /* TOUCH CONTROLS */
  .mobile-touch-bar {
    position: absolute;
    bottom: 24px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 20;
  }
  #joystick-base {
    width: 120px;
    height: 120px;
    background: rgba(255, 255, 255, 0.45);
    border: 2px dashed var(--border-ink);
    border-radius: 50%;
    position: relative;
    pointer-events: auto;
    touch-action: none;
    display: none;
  }
  #joystick-stick {
    width: 50px;
    height: 50px;
    background: var(--border-ink);
    border-radius: 50%;
    position: absolute;
    top: 35px;
    left: 35px;
  }
  .touch-action-btns {
    display: flex;
    gap: 14px;
    pointer-events: auto;
  }
  .touch-btn {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    background: rgba(255, 253, 249, 0.9);
    border: 3px solid var(--border-ink);
    box-shadow: 4px 4px 0 var(--border-ink);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-weight: 900;
    font-size: 14px;
    cursor: pointer;
  }
  .touch-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--border-ink);
  }
  #btn-dash { border-color: var(--cyan); color: #00818A; }
  #btn-ult { border-color: var(--gold); color: #9A7B1C; }

  /* GAME OVER / VICTORY OVERLAY */
  #gameover-screen {
    position: absolute;
    inset: 0;
    background: rgba(244, 240, 232, 0.95);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 200;
    padding: 24px;
  }
  .score-tally-box {
    background: #FFFDF9;
    border: 3px solid var(--border-ink);
    box-shadow: 6px 6px 0 var(--border-ink);
    padding: 24px;
    max-width: 440px;
    width: 100%;
    text-align: center;
    margin: 18px 0;
  }
  .tally-row {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    font-size: 16px;
    font-weight: 700;
    border-bottom: 1px dashed #CCC;
    padding-bottom: 4px;
  }
  .total-score-row {
    font-size: 26px;
    font-weight: 900;
    color: var(--crimson);
    margin-top: 14px;
  }
  .restart-btn {
    background: var(--border-ink);
    color: #FFF;
    border: none;
    padding: 12px 36px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--crimson);
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="hud-overlay">
    <div class="exp-wrapper">
      <div class="exp-fill" id="expFill"></div>
    </div>

    <div class="hud-top">
      <div class="vitals-box">
        <div class="bar-container">
          <span>體力</span>
          <div class="bar-bg"><div class="bar-fill-hp" id="hpFill"></div></div>
          <span id="hpText" style="font-size:11px; width:54px; text-align:right;">350/350</span>
        </div>
        <div class="bar-container">
          <span>氣力</span>
          <div class="bar-bg"><div class="bar-fill-stam" id="stamFill"></div></div>
          <span id="stamText" style="font-size:11px; width:54px; text-align:right;">100%</span>
        </div>
        <div class="bar-container">
          <span>奧義</span>
          <div class="bar-bg"><div class="bar-fill-ult" id="ultFill"></div></div>
          <span id="ultText" style="font-size:11px; width:54px; text-align:right;">0%</span>
        </div>
      </div>

      <div class="center-status">
        <div class="game-timer" id="hudTimer">00:00</div>
        <div class="hud-score-label">戰績: <span id="hudScore">0</span></div>
      </div>

      <div class="level-badge" id="levelBadge">階級 壹</div>
    </div>

    <div id="boss-banner">
      <span id="boss-name" style="font-weight:900; color:#FF5C7A; letter-spacing:2px;">【般若武將・羅剎鬼徹】降臨</span>
      <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
    </div>

    <div class="mobile-touch-bar">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
      <div class="touch-action-btns">
        <div class="touch-btn" id="btn-dash">見切<br><span style="font-size:10px;">SPACE</span></div>
        <div class="touch-btn" id="btn-ult">奧義<br><span style="font-size:10px;">E 鍵</span></div>
      </div>
    </div>
  </div>

  <!-- UPGRADE MODAL -->
  <div id="upgrade-modal">
    <div class="upgrade-title">心法突破・奧義修得</div>
    <div class="cards-deck" id="cardsDeck"></div>
  </div>

  <!-- GAMEOVER / SCORE -->
  <div id="gameover-screen">
    <h1 style="font-size:36px; font-weight:900; letter-spacing:6px; color:var(--crimson);">修羅道・力竭殞命</h1>
    <div class="score-tally-box">
      <div class="tally-row"><span>存活時間</span><span id="tallyTime">00:00</span></div>
      <div class="tally-row"><span>討伐妖魔數</span><span id="tallyKills">0 隻</span></div>
      <div class="tally-row"><span>極意【見切】</span><span id="tallyMikiri">0 次</span></div>
      <div class="tally-row"><span>彈反子彈數</span><span id="tallyParry">0 發</span></div>
      <div class="tally-row"><span>突破最高階級</span><span id="tallyLevel">Lv. 1</span></div>
      <div class="total-score-row"><span>總評價得分: </span><span id="tallyFinalScore">0</span></div>
    </div>
    <button class="restart-btn" id="restartBtn">再入修羅輪迴</button>
  </div>
</div>

<script>
/* ==========================================================================
   AUDIO SYNTHESIZER
   ========================================================================== */
class SoundEngine {
  constructor() {
    this.ctx = null;
  }
  init() {
    if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
  }
  playSlash() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(820, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(120, this.ctx.currentTime + 0.12);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(3000, this.ctx.currentTime);
    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.12);
  }
  playParry() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1900, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(3400, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.28);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.28);
  }
  playMikiri() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(520, now);
    osc.frequency.linearRampToValueAtTime(1040, now + 0.25);
    gain.gain.setValueAtTime(0.45, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.5);
  }
  playHit() {
    if (!this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.09);
    gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.09);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.09);
  }
  playUlt() {
    if (!this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(130, now);
    osc.frequency.linearRampToValueAtTime(1400, now + 0.65);
    gain.gain.setValueAtTime(0.45, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.85);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.85);
  }
}
const audio = new SoundEngine();

/* ==========================================================================
   ENGINE & STATE
   ========================================================================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameWidth = window.innerWidth;
let gameHeight = window.innerHeight;
function resize() {
  gameWidth = window.innerWidth;
  gameHeight = window.innerHeight;
  canvas.width = gameWidth;
  canvas.height = gameHeight;
}
window.addEventListener('resize', resize);
resize();

// Player
const player = {
  x: 0,
  y: 0,
  radius: 16,
  speed: 4.2,
  maxHp: 350,
  hp: 350,
  stamina: 100,
  maxStamina: 100,
  staminaRegen: 34,
  invulnerableTime: 0,
  level: 1,
  exp: 0,
  expToNext: 10,
  ultCharge: 0,
  ultMax: 100,
  facingAngle: 0,
  isMoving: false,
  dashDuration: 0,
  dashCooldown: 0,
  dashDirX: 0,
  dashDirY: 0,
  walkCycle: 0,
  animTime: 0,
  slashAnim: 0,
  weapons: [],
  passives: {
    might: 1.0,
    recovery: 1.0,
    haste: 1.0,
    area: 1.0,
    ironBody: 0.85
  }
};

let keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  audio.init();
  if (e.code === 'Space') triggerDash();
  if (e.key.toLowerCase() === 'e') triggerUltimate();
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// Touch controls
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const joyBase = document.getElementById('joystick-base');
const joyStick = document.getElementById('joystick-stick');
let joyActive = false;
let joyStart = { x: 0, y: 0 };
let joyDelta = { x: 0, y: 0 };

if (isTouchDevice) {
  joyBase.style.display = 'block';
  joyBase.addEventListener('touchstart', e => {
    audio.init();
    joyActive = true;
    const rect = joyBase.getBoundingClientRect();
    joyStart = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  }, { passive: false });

  window.addEventListener('touchmove', e => {
    if (!joyActive) return;
    const t = e.touches[0];
    const dx = t.clientX - joyStart.x;
    const dy = t.clientY - joyStart.y;
    const dist = Math.hypot(dx, dy);
    const maxR = 40;
    const angle = Math.atan2(dy, dx);
    const clampedR = Math.min(dist, maxR);
    joyDelta = { x: (Math.cos(angle) * clampedR) / maxR, y: (Math.sin(angle) * clampedR) / maxR };
    joyStick.style.transform = `translate(${joyDelta.x * maxR}px, ${joyDelta.y * maxR}px)`;
  }, { passive: false });

  const endJoy = () => {
    joyActive = false;
    joyDelta = { x: 0, y: 0 };
    joyStick.style.transform = `translate(0, 0)`;
  };
  window.addEventListener('touchend', endJoy);
  window.addEventListener('touchcancel', endJoy);

  document.getElementById('btn-dash').addEventListener('touchstart', e => {
    e.preventDefault();
    audio.init();
    triggerDash();
  });
  document.getElementById('btn-ult').addEventListener('touchstart', e => {
    e.preventDefault();
    audio.init();
    triggerUltimate();
  });
}

// Scenery & Map Decorations
const zenStones = [];
const stoneLanterns = [];
for (let i = 0; i < 40; i++) {
  zenStones.push({
    x: (Math.random() - 0.5) * 4500,
    y: (Math.random() - 0.5) * 4500,
    rx: Math.random() * 24 + 16,
    ry: Math.random() * 16 + 12,
    angle: Math.random() * Math.PI
  });
}
for (let i = 0; i < 25; i++) {
  stoneLanterns.push({
    x: (Math.random() - 0.5) * 4200,
    y: (Math.random() - 0.5) * 4200
  });
}

// Environmental Petals
const petals = [];
for (let i = 0; i < 65; i++) {
  petals.push({
    x: Math.random() * gameWidth,
    y: Math.random() * gameHeight,
    vx: Math.random() * 30 + 15,
    vy: Math.random() * 25 + 35,
    rot: Math.random() * Math.PI * 2,
    vrot: (Math.random() - 0.5) * 2,
    size: Math.random() * 4 + 4
  });
}

// Game Stats
let stats = {
  startTime: Date.now(),
  elapsedSeconds: 0,
  kills: 0,
  mikiriTriggers: 0,
  parriedBullets: 0,
  score: 0
};

let enemies = [];
let enemyProjectiles = [];
let playerProjectiles = [];
let particles = [];
let floatingTexts = [];
let pickables = [];
let shockwaves = [];
let bloodSplats = [];
let screenShake = 0;
let timeSlowFactor = 1.0;
let timeSlowDuration = 0;
let isPaused = false;
let isGameOver = false;

/* ==========================================================================
   UPGRADES & WEAPONS
   ========================================================================== */
const ALL_UPGRADES = [
  {
    id: 'iaijutsu',
    type: 'weapon',
    name: '居合・水天一文字',
    desc: '斬出帶有水流墨暈的穿透型水藍劍弧，撕裂前方大群妖魔。',
    level: 1,
    maxLevel: 5,
    cooldown: 0.95,
    timer: 0,
    renderPreview(ctx, t) {
      ctx.save();
      ctx.translate(135, 55);
      ctx.strokeStyle = '#00F5FF';
      ctx.lineWidth = 5;
      ctx.shadowColor = '#00F5FF';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      const sweep = Math.sin(t * 8) * 0.8;
      ctx.arc(0, 0, 40, sweep - 0.9, sweep + 0.9);
      ctx.stroke();
      ctx.restore();
    }
  },
  {
    id: 'ofuda',

/* ==========================================================================
   ACTIONS: DASH & MIKIRI & ULTIMATE
   ========================================================================== */
function triggerDash() {
  if (player.dashCooldown > 0 || player.stamina < 30 || isPaused || isGameOver) return;
  player.stamina -= 30;
  player.dashDuration = 0.28;
  player.dashCooldown = 0.52;
  player.invulnerableTime = 0.32;

  let dx = 0, dy = 0;
  if (joyActive) {
    dx = joyDelta.x;
    dy = joyDelta.y;
  } else {
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
  }
  if (dx === 0 && dy === 0) {
    dx = Math.cos(player.facingAngle);
    dy = Math.sin(player.facingAngle);
  } else {
    const len = Math.hypot(dx, dy);
    dx /= len;
    dy /= len;
  }
  player.dashDirX = dx;
  player.dashDirY = dy;
  audio.playSlash();

  // Create ink phantom trail with brush styling
  for (let i = 0; i < 5; i++) {
    particles.push({
      type: 'brushTrail',
      x: player.x - dx * i * 14,
      y: player.y - dy * i * 14,
      vx: (Math.random() - 0.5) * 20,
      vy: (Math.random() - 0.5) * 20,
      radius: 16 - i * 2,
      color: '#00F5FF',
      alpha: 0.65,
      decay: 2.4
    });
  }

  checkMikiriReflect();
}

function checkMikiriReflect() {
  let reflectedAny = false;

  // 1. Reflect Enemy Bullets
  for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
    const p = enemyProjectiles[i];
    const dist = Math.hypot(p.x - player.x, p.y - player.y);
    if (dist < 88) {
      reflectedAny = true;
      stats.parriedBullets++;
      stats.score += 75;
      floatingTexts.push({ x: p.x, y: p.y - 20, text: '彈反！', color: '#00F5FF', life: 0.8, size: 22 });

      playerProjectiles.push({
        type: 'parried',
        x: p.x,
        y: p.y,
        vx: -p.vx * 1.8,
        vy: -p.vy * 1.8,
        damage: 170 * player.passives.might,
        radius: 9,
        penetrate: 3,
        color: '#00F5FF',
        life: 2.0
      });
      enemyProjectiles.splice(i, 1);
    }
  }

  // 2. Mikiri Slash against Active Telegraphing Enemies
  let triggeredMikiri = false;
  enemies.forEach(e => {
    const dist = Math.hypot(e.x - player.x, e.y - player.y);
    if (dist < 115 && (e.isTelegraphing || e.state === 'attack' || e.isCharging)) {
      triggeredMikiri = true;
      e.hp -= 290 * player.passives.might;
      e.stunTimer = 1.2;
      stats.score += 150;

      // Ink Slash Splatters
      bloodSplats.push({
        x: e.x,
        y: e.y,
        radius: Math.random() * 26 + 18,
        color: Math.random() > 0.4 ? 'rgba(255, 16, 55, 0.55)' : 'rgba(26, 24, 23, 0.45)',
        alpha: 1.0
      });

      for (let k = 0; k < 22; k++) {
        particles.push({
          type: 'inkDrop',
          x: e.x,
          y: e.y,
          vx: (Math.random() - 0.5) * 380,
          vy: (Math.random() - 0.5) * 380,
          radius: Math.random() * 5 + 3,
          color: Math.random() > 0.4 ? '#FF1037' : '#00F5FF',
          alpha: 1.0,
          decay: 1.8
        });
      }
    }
  });

  if (triggeredMikiri || reflectedAny) {
    stats.mikiriTriggers++;
    audio.playMikiri();
    triggerTimeSlow(0.18, 0.45);
    screenShake = 16;
    floatingTexts.push({ x: player.x, y: player.y - 48, text: '【見切・居合一閃】', color: '#00F5FF', life: 1.2, size: 26 });
    player.ultCharge = Math.min(player.ultMax, player.ultCharge + 15);
  }
}

function triggerUltimate() {
  if (player.ultCharge < player.ultMax || isPaused || isGameOver) return;
  player.ultCharge = 0;
  audio.playUlt();
  triggerTimeSlow(0.1, 0.7);
  screenShake = 24;

  floatingTexts.push({ x: player.x, y: player.y - 60, text: '奧義・天魔滅殺', color: '#FF1037', life: 1.6, size: 36 });

  enemies.forEach(e => {
    e.hp -= 680 * player.passives.might;
    e.vx = (e.x - player.x) * 0.1;
    e.vy = (e.y - player.y) * 0.1;
  });
  enemyProjectiles = [];

  for (let i = 0; i < 45; i++) {
    particles.push({
      type: 'inkDrop',
      x: player.x + (Math.random() - 0.5) * 850,
      y: player.y + (Math.random() - 0.5) * 650,
      vx: (Math.random() - 0.5) * 450,
      vy: (Math.random() - 0.5) * 450,
      radius: Math.random() * 8 + 3,
      color: Math.random() > 0.5 ? '#FF1037' : '#00F5FF',
      alpha: 1.0,
      decay: 1.5
    });
  }
}

function triggerTimeSlow(factor, duration) {
  timeSlowFactor = factor;
  timeSlowDuration = duration;
}

/* ==========================================================================
   ENEMY SPAWN & BEHAVIORS
   ========================================================================== */
function spawnEnemy(type, isElite = false) {
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.max(gameWidth, gameHeight) * 0.65 + Math.random() * 80;
  const x = player.x + Math.cos(angle) * dist;
  const y = player.y + Math.sin(angle) * dist;

  const timeMul = 1.0 + stats.elapsedSeconds * 0.007;

  const enemy = {
    type,
    x,
    y,
    vx: 0,
    vy: 0,
    radius: 18,
    hp: 55 * timeMul * (isElite ? 4 : 1),
    maxHp: 55 * timeMul * (isElite ? 4 : 1),
    speed: 2.4,
    isElite,
    color: '#3A3530',
    state: 'chase',
    stateTimer: 0,
    shootTimer: Math.random() * 2,
    telegraphAngle: 0,
    isTelegraphing: false,
    stunTimer: 0,
    animTime: Math.random() * 10
  };

  if (type === 'tengu') {
    enemy.speed = 3.6;
    enemy.hp = 42 * timeMul;
  } else if (type === 'samurai') {
    enemy.speed = 2.1;
    enemy.hp = 115 * timeMul;
  } else if (type === 'kitsune') {
    enemy.speed = 1.9;
    enemy.hp = 70 * timeMul;
  } else if (type === 'oni') {
    enemy.speed = 1.4;
    enemy.hp = 270 * timeMul;
    enemy.radius = 28;
  } else if (type === 'sorcerer') {
    enemy.speed = 1.6;
    enemy.hp = 95 * timeMul;
  } else if (type === 'boss_rashamon') {
    enemy.speed = 1.8;
    enemy.radius = 42;
    enemy.hp = 4500;
    enemy.maxHp = 4500;
    enemy.isBoss = true;
    enemy.name = '【般若武將・羅剎鬼徹】';
  } else if (type === 'boss_tamamo') {
    enemy.speed = 2.2;
    enemy.radius = 45;
    enemy.hp = 8200;
    enemy.maxHp = 8200;
    enemy.isBoss = true;
    enemy.name = '【九尾妖狐・玉藻之魂】';
  }

  enemies.push(enemy);
}

function checkLevelUp() {
  if (player.exp >= player.expToNext) {
    player.exp -= player.expToNext;
    player.level++;
    player.expToNext = Math.floor(player.expToNext * 1.35 + 8);
    document.getElementById('levelBadge').innerText = `階級 ${toKanjiNumeral(player.level)}`;
    openUpgradeModal();
  }
}

function toKanjiNumeral(n) {
  const kanji = ['零','壹','貳','參','肆','伍','陸','柒','捌','玖','拾'];
  return kanji[n] || n;
}

let previewAnimId = null;
function openUpgradeModal() {
  isPaused = true;
  const modal = document.getElementById('upgrade-modal');
  const deck = document.getElementById('cardsDeck');
  deck.innerHTML = '';
  modal.style.display = 'flex';

  const pool = ALL_UPGRADES.filter(u => u.level < u.maxLevel);
  const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, 3);
  const previewCanvases = [];

  shuffled.forEach(upgrade => {
    const card = document.createElement('div');
    card.className = 'ema-card';

    const pBox = document.createElement('div');
    pBox.className = 'preview-box';
    const pCanvas = document.createElement('canvas');
    pCanvas.className = 'preview-canvas';
    pCanvas.width = 280;
    pCanvas.height = 110;
    pBox.appendChild(pCanvas);

    const tag = document.createElement('div');
    tag.className = 'card-type-tag';
    tag.innerText = upgrade.type === 'weapon' ? '秘術' : '心法';

    const name = document.createElement('div');
    name.className = 'card-name';
    name.innerText = `${upgrade.name} (Lv.${upgrade.level + 1})`;

    const desc = document.createElement('div');
    desc.className = 'card-desc';
    desc.innerText = upgrade.desc;

    card.appendChild(tag);
    card.appendChild(pBox);
    card.appendChild(name);
    card.appendChild(desc);

    card.onclick = () => {
      selectUpgrade(upgrade);
      cancelAnimationFrame(previewAnimId);
      modal.style.display = 'none';
      isPaused = false;
    };

    deck.appendChild(card);
    previewCanvases.push({ canvas: pCanvas, ctx: pCanvas.getContext('2d'), upgrade });
  });

  let startTime = Date.now();
  function loopPreview() {
    const t = (Date.now() - startTime) / 1000;
    previewCanvases.forEach(item => {
      item.ctx.clearRect(0, 0, item.canvas.width, item.canvas.height);
      item.upgrade.renderPreview(item.ctx, t);
    });
    if (isPaused) {
      previewAnimId = requestAnimationFrame(loopPreview);
    }
  }
  loopPreview();
}

function selectUpgrade(upgrade) {
  upgrade.level++;
  if (upgrade.type === 'weapon') {
    if (!player.weapons.find(w => w.id === upgrade.id)) player.weapons.push(upgrade);
  } else {
    if (upgrade.id === 'passive_might') player.passives.might += 0.25;
    if (upgrade.id === 'passive_armor') {
      player.passives.ironBody = Math.max(0.45, player.passives.ironBody - 0.12);
      player.maxHp += 50;
      player.hp = Math.min(player.maxHp, player.hp + 60);
    }
    if (upgrade.id === 'passive_haste') {
      player.passives.haste *= 0.85;
      player.staminaRegen += 12;
    }
  }
}

/* ==========================================================================
   UPDATE LOOPS
   ========================================================================== */
let lastFrameTime = performance.now();
let spawnTimer = 0;
let bossSpawned1 = false;
let bossSpawned2 = false;

function gameLoop(now) {
  const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
  lastFrameTime = now;

  if (!isPaused && !isGameOver) {
    update(dt);
  }
  render();

  requestAnimationFrame(gameLoop);
}

function update(rawDt) {
  if (timeSlowDuration > 0) {
    timeSlowDuration -= rawDt;
    if (timeSlowDuration <= 0) timeSlowFactor = 1.0;
  }
  const dt = rawDt * timeSlowFactor;

  player.animTime += dt;
  if (player.slashAnim > 0) player.slashAnim -= dt;

  stats.elapsedSeconds = Math.floor((Date.now() - stats.startTime) / 1000);
  const minutes = Math.floor(stats.elapsedSeconds / 60).toString().padStart(2, '0');
  const seconds = (stats.elapsedSeconds % 60).toString().padStart(2, '0');
  document.getElementById('hudTimer').innerText = `${minutes}:${seconds}`;
  document.getElementById('hudScore').innerText = stats.score;

  // Player Movement & Stamina
  player.stamina = Math.min(player.maxStamina, player.stamina + player.staminaRegen * rawDt);
  if (player.dashCooldown > 0) player.dashCooldown -= rawDt;
  if (player.invulnerableTime > 0) player.invulnerableTime -= rawDt;

  if (player.dashDuration > 0) {
    player.dashDuration -= rawDt;
    player.x += player.dashDirX * player.speed * 2.8 * 60 * rawDt;
    player.y += player.dashDirY * player.speed * 2.8 * 60 * rawDt;
    checkMikiriReflect();
  } else {
    let mx = 0, my = 0;
    if (joyActive) {
      mx = joyDelta.x;
      my = joyDelta.y;
    } else {
      if (keys['w'] || keys['arrowup']) my -= 1;
      if (keys['s'] || keys['arrowdown']) my += 1;
      if (keys['a'] || keys['arrowleft']) mx -= 1;
      if (keys['d'] || keys['arrowright']) mx += 1;
    }

    if (mx !== 0 || my !== 0) {
      const len = Math.hypot(mx, my);
      mx /= len;
      my /= len;
      player.x += mx * player.speed * 60 * dt;
      player.y += my * player.speed * 60 * dt;
      player.facingAngle = Math.atan2(my, mx);
      player.isMoving = true;
      player.walkCycle += dt * 14;
    } else {
      player.isMoving = false;
    }
  }

  // Petals Update
  petals.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.rot += p.vrot * dt;
    if (p.x > gameWidth) p.x = -10;
    if (p.y > gameHeight) p.y = -10;
  });

  // Monster Spawns
  spawnTimer += dt;
  const targetMobCount = 35 + Math.min(115, stats.elapsedSeconds * 0.9);
  if (enemies.length < targetMobCount && spawnTimer > 0.25) {
    spawnTimer = 0;
    const roll = Math.random();
    if (roll < 0.3) spawnEnemy('tengu');
    else if (roll < 0.6) spawnEnemy('samurai');
    else if (roll < 0.8) spawnEnemy('kitsune');
    else if (roll < 0.93) spawnEnemy('oni');
    else spawnEnemy('sorcerer');
  }

  if (stats.elapsedSeconds >= 60 && !bossSpawned1) {
    bossSpawned1 = true;
    spawnEnemy('boss_rashamon');
    showBossBanner('【般若武將・羅剎鬼徹】現世！');
  }
  if (stats.elapsedSeconds >= 150 && !bossSpawned2) {
    bossSpawned2 = true;
    spawnEnemy('boss_tamamo');
    showBossBanner('【九尾妖狐・玉藻之魂】禍亂人間！');
  }

  updateWeapons(dt);
  updateEnemyProjectiles(dt);
  updatePlayerProjectiles(dt);
  updateEnemies(dt);
  updatePickables(dt);
  updateFloatingText(dt);
  updateParticles(dt);
  checkLevelUp();

  // HUD Bars
  const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
  document.getElementById('hpFill').style.width = `${hpPercent}%`;
  document.getElementById('hpText').innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;

  const stamPercent = Math.max(0, (player.stamina / player.maxStamina) * 100);
  document.getElementById('stamFill').style.width = `${stamPercent}%`;
  document.getElementById('stamText').innerText = `${Math.floor(stamPercent)}%`;

  const ultPercent = Math.max(0, (player.ultCharge / player.ultMax) * 100);
  document.getElementById('ultFill').style.width = `${ultPercent}%`;
  document.getElementById('ultText').innerText = `${Math.floor(ultPercent)}%`;

  const expPercent = Math.max(0, (player.exp / player.expToNext) * 100);
  document.getElementById('expFill').style.width = `${expPercent}%`;

  player.hp = Math.min(player.maxHp, player.hp + 1.8 * player.passives.recovery * dt);

  if (player.hp <= 0 && !isGameOver) triggerGameOver();
}

function showBossBanner(name) {
  const b = document.getElementById('boss-banner');
  document.getElementById('boss-name').innerText = name;
  b.style.display = 'flex';
}

function updateWeapons(dt) {
  player.weapons.forEach(w => {
    w.timer += dt;
    const effCooldown = w.cooldown * player.passives.haste;

    if (w.id === 'iaijutsu' && w.timer >= effCooldown) {
      w.timer = 0;
      audio.playSlash();
      player.slashAnim = 0.24;

      let targetAngle = player.facingAngle;
      const nearest = getNearestEnemy();
      if (nearest) targetAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);

      playerProjectiles.push({
        type: 'iaijutsu',
        x: player.x,
        y: player.y,
        vx: Math.cos(targetAngle) * 500,
        vy: Math.sin(targetAngle) * 500,
        angle: targetAngle,
        damage: (65 + w.level * 22) * player.passives.might,
        radius: 36 * player.passives.area,
        penetrate: 6 + w.level,
        color: '#00F5FF',
        life: 0.82
      });
    }

    if (w.id === 'ofuda' && w.timer >= effCooldown) {
      w.timer = 0;
      const targets = getNearestEnemies(2 + w.level);
      targets.forEach(t => {
        const ang = Math.atan2(t.y - player.y, t.x - player.x);
        playerProjectiles.push({
          type: 'ofuda',
          x: player.x,
          y: player.y,
          vx: Math.cos(ang) * 400,
          vy: Math.sin(ang) * 400,
          angle: ang,
          target: t,
          damage: (48 + w.level * 18) * player.passives.might,
          radius: 12,
          penetrate: 1,
          color: '#FF1037',
          life: 1.8
        });
      });
    }

    if (w.id === 'sakura') {
      const r = 85 * player.passives.area;
      enemies.forEach(e => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < r + e.radius) {
          e.hp -= (30 + w.level * 8) * player.passives.might * dt;
        }
      });
    }

    if (w.id === 'thunder' && w.timer >= effCooldown) {
      w.timer = 0;
      const eliteOrNearest = enemies.find(e => e.isBoss) || enemies.find(e => e.isElite) || getNearestEnemy();
      if (eliteOrNearest) {
        audio.playHit();
        eliteOrNearest.hp -= (190 + w.level * 60) * player.passives.might;
        screenShake = 8;
        for (let i = 0; i < 18; i++) {
          particles.push({
            type: 'inkDrop',
            x: eliteOrNearest.x,
            y: eliteOrNearest.y,
            vx: (Math.random() - 0.5) * 220,
            vy: (Math.random() - 0.5) * 220,
            radius: 5,
            color: '#FF1037',
            alpha: 1,
            decay: 2.2
          });
        }
      }
    }

    if (w.id === 'caltrop' && w.timer >= effCooldown) {
      w.timer = 0;
      pickables.push({
        type: 'caltrop',
        x: player.x,
        y: player.y,
        life: 6.0,
        damage: (35 + w.level * 15) * player.passives.might
      });
    }
  });
}

function getNearestEnemy() {
  let near = null, minDist = Infinity;
  enemies.forEach(e => {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < minDist) {
      minDist = d;
      near = e;
    }
  });
  return near;
}

function getNearestEnemies(count) {
  return [...enemies].sort((a, b) => {
    const da = Math.hypot(a.x - player.x, a.y - player.y);
    const db = Math.hypot(b.x - player.x, b.y - player.y);
    return da - db;
  }).slice(0, count);
}

function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.animTime += dt;

    if (e.stunTimer > 0) {
      e.stunTimer -= dt;
      continue;
    }

    const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
    const angleToPlayer = Math.atan2(player.y - e.y, player.x - e.x);

    if (e.type === 'tengu') {
      e.shootTimer -= dt;
      if (e.shootTimer <= 0 && distToPlayer < 450) {
        e.shootTimer = 2.4;
        enemyProjectiles.push({
          type: 'feather',
          x: e.x,
          y: e.y,
          vx: Math.cos(angleToPlayer) * 270,
          vy: Math.sin(angleToPlayer) * 270,
          damage: 22,
          radius: 7,
          color: '#1A1817'
        });
      }
      e.x += Math.cos(angleToPlayer) * e.speed * 60 * dt;
      e.y += Math.sin(angleToPlayer) * e.speed * 60 * dt;
    }

    else if (e.type === 'samurai') {
      e.shootTimer -= dt;
      if (e.state === 'chase') {
        e.x += Math.cos(angleToPlayer) * e.speed * 60 * dt;
        e.y += Math.sin(angleToPlayer) * e.speed * 60 * dt;
        if (e.shootTimer <= 0 && distToPlayer < 220) {
          e.state = 'telegraph';
          e.stateTimer = 0.6;
          e.isTelegraphing = true;
          e.telegraphAngle = angleToPlayer;
        }
      } else if (e.state === 'telegraph') {
        e.stateTimer -= dt;
        if (e.stateTimer <= 0) {
          e.state = 'charge';
          e.stateTimer = 0.25;
          e.isTelegraphing = false;
        }
      } else if (e.state === 'charge') {
        e.stateTimer -= dt;
        e.x += Math.cos(e.telegraphAngle) * e.speed * 3.8 * 60 * dt;
        e.y += Math.sin(e.telegraphAngle) * e.speed * 3.8 * 60 * dt;
        if (e.stateTimer <= 0) {
          e.state = 'chase';
          e.shootTimer = 3.0;
        }
      }
    }

    else if (e.type === 'kitsune') {
      if (distToPlayer < 180) {
        e.x -= Math.cos(angleToPlayer) * e.speed * 60 * dt;
        e.y -= Math.sin(angleToPlayer) * e.speed * 60 * dt;
      } else {
        e.x += Math.cos(angleToPlayer) * e.speed * 0.7 * 60 * dt;
        e.y += Math.sin(angleToPlayer) * e.speed * 0.7 * 60 * dt;
      }
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        e.shootTimer = 2.8;
        for (let s = -1; s <= 1; s += 2) {
          const spread = angleToPlayer + s * 0.25;
          enemyProjectiles.push({
            type: 'fireball',
            x: e.x,
            y: e.y,
            vx: Math.cos(spread) * 200,
            vy: Math.sin(spread) * 200,
            damage: 26,
            radius: 9,
            color: '#00F5FF'
          });
        }
      }
    }

    else if (e.type === 'oni') {
      e.shootTimer -= dt;
      if (e.state === 'chase') {
        e.x += Math.cos(angleToPlayer) * e.speed * 60 * dt;
        e.y += Math.sin(angleToPlayer) * e.speed * 60 * dt;
        if (e.shootTimer <= 0 && distToPlayer < 170) {
          e.state = 'smash_windup';
          e.stateTimer = 0.8;
          e.isTelegraphing = true;
        }
      } else if (e.state === 'smash_windup') {
        e.stateTimer -= dt;
        if (e.stateTimer <= 0) {
          e.state = 'chase';
          e.shootTimer = 4.0;
          e.isTelegraphing = false;
          shockwaves.push({
            x: e.x,
            y: e.y,
            radius: 10,
            maxRadius: 115,
            damage: 48,
            color: '#FF1037'
          });
          audio.playHit();
          screenShake = 12;
        }
      }
    }

    else if (e.type === 'sorcerer') {
      e.x += Math.cos(angleToPlayer) * e.speed * 60 * dt;
      e.y += Math.sin(angleToPlayer) * e.speed * 60 * dt;
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        e.shootTimer = 3.6;
        for (let a = 0; a < 8; a++) {
          const ringAng = (Math.PI * 2 / 8) * a;
          enemyProjectiles.push({
            type: 'bullet',
            x: e.x,
            y: e.y,
            vx: Math.cos(ringAng) * 160,
            vy: Math.sin(ringAng) * 160,
            damage: 20,
            radius: 7,
            color: '#E5B239'
          });
        }
      }
    }

    else if (e.isBoss) {
      e.x += Math.cos(angleToPlayer) * e.speed * 60 * dt;
      e.y += Math.sin(angleToPlayer) * e.speed * 60 * dt;
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        e.shootTimer = 2.0;
        for (let k = -2; k <= 2; k++) {
          const fanAng = angleToPlayer + k * 0.22;
          enemyProjectiles.push({
            type: 'boss_bullet',
            x: e.x,
            y: e.y,
            vx: Math.cos(fanAng) * 230,
            vy: Math.sin(fanAng) * 230,
            damage: 32,
            radius: 10,
            color: '#FF1037'
          });
        }
      }
      const fill = document.getElementById('boss-hp-fill');
      if (fill) fill.style.width = `${Math.max(0, (e.hp / e.maxHp) * 100)}%`;
    }

    // Direct collision
    if (distToPlayer < player.radius + e.radius && player.invulnerableTime <= 0) {
      const rawDmg = (e.isBoss ? 45 : 22);
      const actualDmg = rawDmg * player.passives.ironBody;
      player.hp -= actualDmg;
      player.invulnerableTime = 0.45;
      audio.playHit();
      screenShake = 6;
      floatingTexts.push({ x: player.x, y: player.y - 30, text: `-${Math.round(actualDmg)}`, color: '#FF1037', life: 0.8, size: 18 });
    }

    // Caltrops hit
    pickables.forEach(pk => {
      if (pk.type === 'caltrop') {
        if (Math.hypot(e.x - pk.x, e.y - pk.y) < 35) {
          e.hp -= pk.damage * dt;
          e.x -= Math.cos(angleToPlayer) * 1.5;
          e.y -= Math.sin(angleToPlayer) * 1.5;
        }
      }
    });

    // Mob Death
    if (e.hp <= 0) {
      stats.kills++;
      stats.score += e.isBoss ? 2000 : (e.isElite ? 250 : 50);
      player.ultCharge = Math.min(player.ultMax, player.ultCharge + (e.isBoss ? 50 : 4));

      pickables.push({
        type: 'magatama',
        x: e.x,
        y: e.y,
        exp: e.isBoss ? 120 : (e.isElite ? 35 : 10)
      });

      bloodSplats.push({
        x: e.x,
        y: e.y,
        radius: Math.random() * 20 + 16,
        color: Math.random() > 0.4 ? 'rgba(255, 16, 55, 0.45)' : 'rgba(26, 24, 23, 0.4)',
        alpha: 1.0
      });

      for (let p = 0; p < (e.isBoss ? 35 : 12); p++) {
        particles.push({
          type: 'inkDrop',
          x: e.x,
          y: e.y,
          vx: (Math.random() - 0.5) * 260,
          vy: (Math.random() - 0.5) * 260,
          radius: Math.random() * 6 + 2,
          color: Math.random() > 0.4 ? '#FF1037' : '#1A1817',
          alpha: 1.0,
          decay: 1.8
        });
      }

      if (e.isBoss) {
        document.getElementById('boss-banner').style.display = 'none';
        floatingTexts.push({ x: e.x, y: e.y - 50, text: '【首領討伐・大成】', color: '#E5B239', life: 2.0, size: 34 });
      }

      enemies.splice(i, 1);
    }
  }
}

function updateEnemyProjectiles(dt) {
  for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
    const p = enemyProjectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    const dist = Math.hypot(p.x - player.x, p.y - player.y);
    if (dist < p.radius + 14) {
      if (player.dashDuration > 0 || player.invulnerableTime > 0) {
        stats.parriedBullets++;
        stats.score += 80;
        audio.playParry();
        floatingTexts.push({ x: p.x, y: p.y - 15, text: '彈反！', color: '#00F5FF', life: 0.8, size: 20 });

        playerProjectiles.push({
          type: 'parried',
          x: p.x,
          y: p.y,
          vx: -p.vx * 1.6,
          vy: -p.vy * 1.6,
          damage: 150 * player.passives.might,
          radius: 8,
          penetrate: 2,
          color: '#00F5FF',
          life: 2.0
        });
        enemyProjectiles.splice(i, 1);
        continue;
      } else {
        const dmg = p.damage * player.passives.ironBody;
        player.hp -= dmg;
        audio.playHit();
        screenShake = 5;
        floatingTexts.push({ x: player.x, y: player.y - 25, text: `-${Math.round(dmg)}`, color: '#FF1037', life: 0.8, size: 16 });
        enemyProjectiles.splice(i, 1);
        continue;
      }
    }

    if (Math.hypot(p.x - player.x, p.y - player.y) > 1200) {
      enemyProjectiles.splice(i, 1);
    }
  }

  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.radius += 180 * dt;
    const dist = Math.hypot(sw.x - player.x, sw.y - player.y);
    if (Math.abs(dist - sw.radius) < 18 && player.invulnerableTime <= 0) {
      const dmg = sw.damage * player.passives.ironBody;
      player.hp -= dmg;
      player.invulnerableTime = 0.4;
      audio.playHit();
      floatingTexts.push({ x: player.x, y: player.y - 25, text: `-${Math.round(dmg)}`, color: '#FF1037', life: 0.8, size: 20 });
    }
    if (sw.radius >= sw.maxRadius) shockwaves.splice(i, 1);
  }
}

function updatePlayerProjectiles(dt) {
  for (let i = playerProjectiles.length - 1; i >= 0; i--) {
    const p = playerProjectiles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    enemies.forEach(e => {
      if (p.penetrate <= 0) return;
      const d = Math.hypot(p.x - e.x, p.y - e.y);
      if (d < p.radius + e.radius) {
        e.hp -= p.damage;
        p.penetrate--;

        for (let k = 0; k < 6; k++) {
          particles.push({
            type: 'inkDrop',
            x: e.x,
            y: e.y,
            vx: (Math.random() - 0.5) * 160,
            vy: (Math.random() - 0.5) * 160,
            radius: 4,
            color: p.color,
            alpha: 1,
            decay: 2.2
          });
        }
      }
    });

    if (p.life <= 0 || p.penetrate <= 0) {
      playerProjectiles.splice(i, 1);
    }
  }
}

function updatePickables(dt) {
  for (let i = pickables.length - 1; i >= 0; i--) {
    const item = pickables[i];

    if (item.type === 'caltrop') {
      item.life -= dt;
      if (item.life <= 0) pickables.splice(i, 1);
      continue;
    }

    const dist = Math.hypot(player.x - item.x, player.y - item.y);
    if (dist < 180) {
      const angle = Math.atan2(player.y - item.y, player.x - item.x);
      item.x += Math.cos(angle) * 360 * dt;
      item.y += Math.sin(angle) * 360 * dt;
    }

    if (dist < 26) {
      player.exp += item.exp;
      stats.score += item.exp * 2;
      pickables.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.alpha -= p.decay * dt;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function updateFloatingText(dt) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const f = floatingTexts[i];
    f.life -= dt;
    f.y -= 25 * dt;
    if (f.life <= 0) floatingTexts.splice(i, 1);
  }
}

function triggerGameOver() {
  isGameOver = true;
  document.getElementById('gameover-screen').style.display = 'flex';

  const m = Math.floor(stats.elapsedSeconds / 60).toString().padStart(2, '0');
  const s = (stats.elapsedSeconds % 60).toString().padStart(2, '0');

  document.getElementById('tallyTime').innerText = `${m}:${s}`;
  document.getElementById('tallyKills').innerText = `${stats.kills} 隻`;
  document.getElementById('tallyMikiri').innerText = `${stats.mikiriTriggers} 次`;
  document.getElementById('tallyParry').innerText = `${stats.parriedBullets} 發`;
  document.getElementById('tallyLevel').innerText = `Lv. ${player.level}`;

  const finalScore = stats.score 
    + (stats.elapsedSeconds * 20) 
    + (stats.kills * 45) 
    + (stats.mikiriTriggers * 200) 
    + (stats.parriedBullets * 120)
    + (player.level * 300);

  document.getElementById('tallyFinalScore').innerText = finalScore.toLocaleString();
}

document.getElementById('restartBtn').onclick = () => window.location.reload();

/* ==========================================================================
   HIGH-QUALITY JAPANESE INK RENDERING SYSTEM
   ========================================================================== */
function render() {
  ctx.save();

  if (screenShake > 0) {
    const sx = (Math.random() - 0.5) * screenShake;
    const sy = (Math.random() - 0.5) * screenShake;
    ctx.translate(sx, sy);
    screenShake = Math.max(0, screenShake - 0.8);
  }

  ctx.clearRect(0, 0, gameWidth, gameHeight);

  const camX = gameWidth / 2 - player.x;
  const camY = gameHeight / 2 - player.y;
  ctx.translate(camX, camY);

  // 1. Washi Background & Decorative Zen Environment
  drawScenery();

  // 2. Ink Splatters on ground
  drawBloodSplats();

  // 3. Ground Pickables & Caltrops
  drawPickables();

  // 4. Enemy Telegraphs
  drawTelegraphs();

  // 5. Enemies with high-res details
  drawEnemies();

  // 6. Projectiles
  drawProjectiles();

  // 7. Player (Detailed Ronin with flowing clothes & sword trails)
  drawPlayer();

  // 8. Shockwaves & Particles
  drawShockwaves();
  drawParticles();

  // 9. Floating Combat Kanji
  drawFloatingTexts();

  ctx.restore();

  // 10. Foreground environmental sakura petals (Screen Space)
  drawForePetals();
}

function drawScenery() {
  // Tatami / Zen raked gravel lines
  const gridSize = 140;
  const startX = Math.floor((player.x - gameWidth) / gridSize) * gridSize;
  const endX = Math.floor((player.x + gameWidth) / gridSize) * gridSize;
  const startY = Math.floor((player.y - gameHeight) / gridSize) * gridSize;
  const endY = Math.floor((player.y + gameHeight) / gridSize) * gridSize;

  ctx.strokeStyle = 'rgba(215, 206, 192, 0.6)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let x = startX; x <= endX; x += gridSize) {
    ctx.moveTo(x, startY);
    ctx.lineTo(x, endY);
  }
  for (let y = startY; y <= endY; y += gridSize) {
    ctx.moveTo(startX, y);
    ctx.lineTo(endX, y);
  }
  ctx.stroke();

  // Zen Stones
  zenStones.forEach(st => {
    if (Math.abs(st.x - player.x) < gameWidth && Math.abs(st.y - player.y) < gameHeight) {
      ctx.save();
      ctx.translate(st.x, st.y);
      ctx.rotate(st.angle);
      // Soft shadow
      ctx.fillStyle = 'rgba(40, 35, 30, 0.15)';
      ctx.beginPath();
      ctx.ellipse(4, 6, st.rx, st.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      // Stone
      ctx.fillStyle = '#CFC7B8';
      ctx.strokeStyle = '#2D2723';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(0, 0, st.rx, st.ry, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
      ctx.restore();
    }
  });

  // Stone Lanterns
  stoneLanterns.forEach(lt => {
    if (Math.abs(lt.x - player.x) < gameWidth && Math.abs(lt.y - player.y) < gameHeight) {
      ctx.save();
      ctx.translate(lt.x, lt.y);
      ctx.fillStyle = 'rgba(45, 39, 35, 0.2)';
      ctx.fillRect(-12, 12, 24, 6);
      ctx.fillStyle = '#B8AFA0';
      ctx.strokeStyle = '#2D2723';
      ctx.lineWidth = 2;
      ctx.fillRect(-8, -16, 16, 28);
      ctx.strokeRect(-8, -16, 16, 28);
      // Roof
      ctx.beginPath();
      ctx.moveTo(-16, -16);
      ctx.lineTo(16, -16);
      ctx.lineTo(0, -26);
      ctx.closePath();
      ctx.fillStyle = '#8C8274';
      ctx.fill();
      ctx.stroke();
      // Lantern light
      ctx.fillStyle = '#FFE685';
      ctx.beginPath();
      ctx.arc(0, -6, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  });
}

function drawBloodSplats() {
  if (bloodSplats.length > 50) bloodSplats.shift();
  bloodSplats.forEach(b => {
    ctx.save();
    ctx.fillStyle = b.color;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawTelegraphs() {
  enemies.forEach(e => {
    if (e.isTelegraphing) {
      if (e.type === 'samurai') {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 16, 55, 0.65)';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(e.telegraphAngle) * 260, e.y + Math.sin(e.telegraphAngle) * 260);
        ctx.stroke();
        ctx.restore();
      } else if (e.type === 'oni') {
        ctx.save();
        ctx.fillStyle = 'rgba(255, 16, 55, 0.22)';
        ctx.strokeStyle = '#FF1037';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 115, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        ctx.restore();
      }
    }
  });
}

/* --------------------------------------------------------------------------
   DETAILED ENEMY ART
   -------------------------------------------------------------------------- */
function drawEnemies() {
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);

    const angle = Math.atan2(player.y - e.y, player.x - e.x);

    if (e.type === 'tengu') {
      // 烏天狗 (Crow Tengu): Feathery animated wings & red mask
      const wingFlap = Math.sin(e.animTime * 14) * 0.45;
      ctx.save();
      ctx.rotate(angle);

      // Left Wing
      ctx.save();
      ctx.rotate(wingFlap);
      ctx.fillStyle = '#1A1817';
      ctx.beginPath();
      ctx.moveTo(0, -6);
      ctx.quadraticCurveTo(-24, -28, -36, -14);
      ctx.quadraticCurveTo(-18, -6, 0, -2);
      ctx.fill();
      ctx.restore();

      // Right Wing
      ctx.save();
      ctx.rotate(-wingFlap);
      ctx.fillStyle = '#1A1817';
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.quadraticCurveTo(-24, 28, -36, 14);
      ctx.quadraticCurveTo(-18, 6, 0, 2);
      ctx.fill();
      ctx.restore();

      // Robe body
      ctx.fillStyle = '#2A2624';
      ctx.beginPath();
      ctx.arc(0, 0, 11, 0, Math.PI * 2);
      ctx.fill();

      // Red Tengu Mask & Long Nose
      ctx.fillStyle = '#FF1037';
      ctx.beginPath();
      ctx.arc(5, 0, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(8, -2);
      ctx.lineTo(19, 0);
      ctx.lineTo(8, 2);
      ctx.fill();

      // Glowing white eye
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(6, -2, 1.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    else if (e.type === 'samurai') {
      // 骸骨武者 (Skeleton Samurai): Armor kabuto + sashimono flag
      ctx.save();
      ctx.rotate(angle);

      // Battle flag (Sashimono)
      ctx.strokeStyle = '#2D2723';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(-16, 0);
      ctx.lineTo(-26, 0);
      ctx.stroke();
      ctx.fillStyle = '#FF1037';
      ctx.fillRect(-26, -12, 10, 24);

      // Skeletal Armor Body
      ctx.fillStyle = '#DDD5C7';
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();

      // Armored Kabuto Hat
      ctx.fillStyle = '#1A1817';
      ctx.beginPath();
      ctx.ellipse(0, 0, 15, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      // Glowing Cyan Eye Sockets
      ctx.fillStyle = '#00F5FF';
      ctx.shadowColor = '#00F5FF';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(5, -3, 2, 0, Math.PI * 2);
      ctx.arc(5, 3, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    else if (e.type === 'kitsune') {
      // 幽冥妖狐 (Fox Spirit): 3 animated flowing fire tails & kitsune mask
      ctx.save();
      ctx.rotate(angle);

      // 3 Fire Tails
      for (let t = -1; t <= 1; t++) {
        const wave = Math.sin(e.animTime * 6 + t) * 4;
        ctx.fillStyle = 'rgba(0, 245, 255, 0.75)';
        ctx.shadowColor = '#00F5FF';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.moveTo(-10, t * 6);
        ctx.quadraticCurveTo(-26 + wave, t * 14 + wave, -36, t * 8);
        ctx.quadraticCurveTo(-22, t * 2, -10, t * 6);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      // Kitsune White Face Mask
      ctx.fillStyle = '#FFFDF9';
      ctx.beginPath();
      ctx.ellipse(2, 0, 11, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Crimson Whisker Marks
      ctx.strokeStyle = '#FF1037';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(3, -5); ctx.lineTo(8, -4);
      ctx.moveTo(3, 5); ctx.lineTo(8, 4);
      ctx.stroke();

      // Fox Ears
      ctx.fillStyle = '#FF1037';
      ctx.beginPath();
      ctx.moveTo(-4, -8); ctx.lineTo(2, -13); ctx.lineTo(1, -7);
      ctx.moveTo(-4, 8); ctx.lineTo(2, 13); ctx.lineTo(1, 7);
      ctx.fill();
      ctx.restore();
    }

    else if (e.type === 'oni') {
      // 赤鬼狂徒 (Red Oni): Massive horns, spiked club
      ctx.save();
      ctx.rotate(angle);

      // Body & muscular back
      ctx.fillStyle = '#8B1825';
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.fill();

      // Golden Demon Horns
      ctx.fillStyle = '#E5B239';
      ctx.beginPath();
      ctx.moveTo(2, -16); ctx.lineTo(10, -28); ctx.lineTo(8, -14);
      ctx.moveTo(2, 16); ctx.lineTo(10, 28); ctx.lineTo(8, 14);
      ctx.fill();

      // Fierce glowing eyes
      ctx.fillStyle = '#FFE685';
      ctx.beginPath();
      ctx.arc(10, -6, 3, 0, Math.PI * 2);
      ctx.arc(10, 6, 3, 0, Math.PI * 2);
      ctx.fill();

      // Spiked Kanabo Club
      ctx.fillStyle = '#1A1817';
      ctx.fillRect(8, 16, 26, 7);
      ctx.fillStyle = '#DDD5C7';
      ctx.beginPath();
      ctx.arc(22, 14, 2, 0, Math.PI * 2);
      ctx.arc(28, 14, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    else if (e.isBoss) {
      // Boss: Magnificent Shura Demon
      ctx.save();
      ctx.rotate(angle);

      // Demonic Aura
      const auraPulse = 36 + Math.sin(e.animTime * 8) * 4;
      ctx.strokeStyle = 'rgba(255, 16, 55, 0.55)';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#FF1037';
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(0, 0, auraPulse, 0, Math.PI * 2);
      ctx.stroke();

      // Boss Armor Body
      ctx.fillStyle = '#1A1817';
      ctx.beginPath();
      ctx.arc(0, 0, 32, 0, Math.PI * 2);
      ctx.fill();

      // Golden Crown & Horns
      ctx.fillStyle = '#E5B239';
      ctx.beginPath();
      ctx.moveTo(-10, -25); ctx.lineTo(12, -42); ctx.lineTo(6, -20);
      ctx.moveTo(-10, 25); ctx.lineTo(12, 42); ctx.lineTo(6, 20);
      ctx.fill();

      // Calligraphy Center
      ctx.fillStyle = '#FFF';
      ctx.font = 'bold 24px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('鬼', 0, 0);
      ctx.restore();
    }

    else {
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Health Bar for Elite / Boss
    if (e.hp < e.maxHp && !e.isBoss) {
      const bw = e.radius * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(-bw/2, -e.radius - 12, bw, 4);
      ctx.fillStyle = '#FF1037';
      ctx.fillRect(-bw/2, -e.radius - 12, bw * (e.hp / e.maxHp), 4);
    }

    ctx.restore();
  });
}

/* --------------------------------------------------------------------------
   DETAILED PLAYER ART & ANIMATION (緋刃浪人・孤狼)
   -------------------------------------------------------------------------- */
function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  ctx.rotate(player.facingAngle);

  const walkOffset = player.isMoving ? Math.sin(player.walkCycle) * 3 : 0;
  const capeWave = Math.sin(player.animTime * 8) * 4;

  // 1. Flowing Charcoal Haori Cape (Layered)
  ctx.fillStyle = '#1A1817';
  ctx.beginPath();
  ctx.moveTo(-10, -12);
  ctx.quadraticCurveTo(-26 + capeWave, -16, -34, -4);
  ctx.quadraticCurveTo(-24, 0, -34, 4);
  ctx.quadraticCurveTo(-26 - capeWave, 16, -10, 12);
  ctx.closePath();
  ctx.fill();

  // 2. White Kimono Underlayer
  ctx.fillStyle = '#ECE6D8';
  ctx.beginPath();
  ctx.ellipse(-2 + walkOffset, 0, 14, 11, 0, 0, Math.PI * 2);
  ctx.fill();

  // 3. Cinnabar Crimson Sash (Obi)
  ctx.fillStyle = '#FF1037';
  ctx.fillRect(-6 + walkOffset, -10, 6, 20);

  // 4. Ronin Head & Ponytail Hair
  ctx.fillStyle = '#2A2624';
  ctx.beginPath();
  ctx.arc(5 + walkOffset, 0, 9, 0, Math.PI * 2);
  ctx.fill();

  // Ponytail swinging behind
  ctx.beginPath();
  ctx.moveTo(0 + walkOffset, -2);
  ctx.quadraticCurveTo(-14, -6 - capeWave, -22, -10);
  ctx.quadraticCurveTo(-12, -2, 0 + walkOffset, 2);
  ctx.fill();

  // 5. Vermilion Headband / Eye-Band
  ctx.fillStyle = '#FF1037';
  ctx.fillRect(4 + walkOffset, -7, 4, 14);

  // 6. Katana Sheath & Grip
  ctx.strokeStyle = '#E5B239';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-12, 12);
  ctx.lineTo(8, 12);
  ctx.stroke();

  // 7. Dynamic Blade Slash Arc (When attacking)
  if (player.slashAnim > 0) {
    ctx.save();
    ctx.strokeStyle = '#00F5FF';
    ctx.lineWidth = 5;
    ctx.shadowColor = '#00F5FF';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.arc(6, 0, 44, -Math.PI / 3, Math.PI / 3);
    ctx.stroke();
    ctx.restore();
  }

  // 8. Parry / Mikiri Shield Aura
  if (player.dashDuration > 0 || player.invulnerableTime > 0) {
    ctx.strokeStyle = '#00F5FF';
    ctx.shadowColor = '#00F5FF';
    ctx.shadowBlur = 16;
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.arc(0, 0, 32, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

/* --------------------------------------------------------------------------
   DETAILED PROJECTILES & PARTICLES
   -------------------------------------------------------------------------- */
function drawProjectiles() {
  // Enemy Projectiles
  enemyProjectiles.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.type === 'feather') {
      const ang = Math.atan2(p.vy, p.vx);
      ctx.rotate(ang);
      ctx.fillStyle = '#1A1817';
      ctx.beginPath();
      ctx.moveTo(-8, 0); ctx.lineTo(10, 0); ctx.lineTo(2, 3); ctx.lineTo(-8, 0);
      ctx.fill();
    } else {
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });

  // Player Projectiles
  playerProjectiles.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);

    if (p.type === 'iaijutsu') {
      ctx.rotate(p.angle);
      ctx.strokeStyle = '#00F5FF';
      ctx.shadowColor = '#00F5FF';
      ctx.shadowBlur = 16;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.arc(0, 0, 36, -Math.PI / 3.2, Math.PI / 3.2);
      ctx.stroke();
    } else if (p.type === 'ofuda') {
      ctx.rotate(p.angle);
      ctx.fillStyle = '#FF1037';
      ctx.shadowColor = '#FF1037';
      ctx.shadowBlur = 10;
      ctx.fillRect(-7, -12, 14, 24);
      ctx.fillStyle = '#FFE5A3';
      ctx.fillRect(-2, -6, 4, 12);
    } else {
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(0, 0, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });
}

function drawPickables() {
  pickables.forEach(pk => {
    if (pk.type === 'magatama') {
      ctx.save();
      ctx.translate(pk.x, pk.y);
      ctx.fillStyle = '#00F5FF';
      ctx.shadowColor = '#00F5FF';
      ctx.shadowBlur = 10;
      // Magatama comma shape
      ctx.beginPath();
      ctx.arc(0, -3, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(4, -3);
      ctx.quadraticCurveTo(6, 6, 0, 8);
      ctx.quadraticCurveTo(2, 4, -4, -3);
      ctx.fill();
      ctx.restore();
    } else if (pk.type === 'caltrop') {
      ctx.fillStyle = '#1A1817';
      ctx.beginPath();
      ctx.arc(pk.x, pk.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function drawShockwaves() {
  shockwaves.forEach(sw => {
    ctx.save();
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 4;
    ctx.shadowColor = sw.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillStyle = p.color;
    if (p.type === 'brushTrail') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  });
}

function drawFloatingTexts() {
  floatingTexts.forEach(f => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color;
    ctx.font = `bold ${f.size || 22}px 'Yu Mincho', serif`;
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 6;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  });
}

function drawForePetals() {
  petals.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.fillStyle = 'rgba(255, 92, 122, 0.7)';
    ctx.beginPath();
    ctx.ellipse(0, 0, p.size, p.size * 0.55, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

// Start Main Animation Frame Loop
requestAnimationFrame(gameLoop);
</script>
