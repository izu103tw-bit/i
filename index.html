<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>緋刃浪人・孤狼：修羅極限</title>
<style>
  :root {
    --bg-washi: #F4F1EA;
    --sumi-dark: #1E1D1D;
    --crimson: #FF1E44;
    --cyan: #00F0FF;
    --gold: #D4AF37;
    --border-ink: #3A3530;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    font-family: 'Hiragino Mincho ProN', 'Songti TC', 'Noto Serif TC', serif;
  }
  body, html {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background-color: var(--bg-washi);
    color: var(--sumi-dark);
  }
  #game-container {
    position: relative;
    width: 100vw;
    height: 100vh;
    background: radial-gradient(circle at center, #FAF8F5 0%, #E8E3D8 100%);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  /* HUD */
  #hud-overlay {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 10;
  }
  .hud-top {
    position: absolute;
    top: 14px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .vitals-box {
    display: flex;
    flex-direction: column;
    gap: 6px;
    width: min(280px, 45vw);
    background: rgba(255, 255, 255, 0.75);
    padding: 10px 14px;
    border: 2px solid var(--border-ink);
    box-shadow: 3px 3px 0 var(--border-ink);
  }
  .bar-container {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 700;
  }
  .bar-bg {
    flex: 1;
    height: 10px;
    background: #DDD5C7;
    border: 1px solid var(--border-ink);
    position: relative;
    overflow: hidden;
  }
  .bar-fill-hp {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #FF1E44, #FF5C7A);
    transition: width 0.15s ease-out;
  }
  .bar-fill-stam {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #00A6B4, #00F0FF);
    transition: width 0.1s ease-out;
  }
  .bar-fill-ult {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #D4AF37, #FFE17D);
    transition: width 0.15s ease-out;
  }

  /* TOP CENTER CLOCK & SCORE */
  .center-status {
    position: absolute;
    top: 12px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    background: rgba(255, 255, 255, 0.85);
    padding: 6px 18px;
    border: 2px solid var(--border-ink);
    box-shadow: 3px 3px 0 var(--border-ink);
  }
  .game-timer {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
    color: var(--sumi-dark);
  }
  .hud-score-label {
    font-size: 13px;
    font-weight: 800;
    color: var(--crimson);
    letter-spacing: 1px;
  }

  /* EXP BAR */
  .exp-wrapper {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 6px;
    background: rgba(0,0,0,0.1);
  }
  .exp-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--cyan), var(--crimson));
    transition: width 0.1s;
  }
  .level-badge {
    position: absolute;
    top: 10px;
    right: 20px;
    background: rgba(255, 255, 255, 0.9);
    border: 2px solid var(--border-ink);
    padding: 6px 14px;
    font-size: 15px;
    font-weight: 900;
    box-shadow: 3px 3px 0 var(--border-ink);
  }

  /* BOSS BANNER */
  #boss-banner {
    position: absolute;
    top: 75px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(20, 20, 20, 0.9);
    color: #FFF;
    border: 2px solid var(--crimson);
    padding: 6px 20px;
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    width: min(340px, 80vw);
    box-shadow: 0 0 15px rgba(255, 30, 68, 0.4);
  }
  #boss-hp-bar {
    width: 100%;
    height: 8px;
    background: #333;
    border: 1px solid #777;
  }
  #boss-hp-fill {
    width: 100%;
    height: 100%;
    background: var(--crimson);
  }

  /* UPGRADE MODAL */
  #upgrade-modal {
    position: absolute;
    inset: 0;
    background: rgba(235, 230, 220, 0.82);
    backdrop-filter: blur(4px);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 100;
    padding: 16px;
  }
  .upgrade-title {
    font-size: 26px;
    font-weight: 900;
    margin-bottom: 20px;
    letter-spacing: 4px;
    position: relative;
    padding-bottom: 8px;
  }
  .upgrade-title::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 3px;
    background: var(--crimson);
  }
  .cards-deck {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    justify-content: center;
    max-width: 950px;
    width: 100%;
  }
  .ema-card {
    background: #FFFDF9;
    border: 3px solid var(--border-ink);
    box-shadow: 6px 6px 0 var(--border-ink);
    width: 270px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 14px;
    cursor: pointer;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    pointer-events: auto;
    position: relative;
  }
  .ema-card:hover {
    transform: translateY(-6px);
    box-shadow: 8px 10px 0 var(--crimson);
    border-color: var(--crimson);
  }
  .preview-box {
    width: 100%;
    height: 110px;
    background: #F1EDE4;
    border: 1px solid #C4BCAC;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
  }
  .preview-canvas {
    width: 100%;
    height: 100%;
  }
  .card-type-tag {
    position: absolute;
    top: 8px;
    right: 8px;
    font-size: 11px;
    padding: 2px 6px;
    font-weight: 900;
    background: var(--border-ink);
    color: #FFF;
  }
  .card-name {
    font-size: 18px;
    font-weight: 900;
    margin-bottom: 6px;
    color: var(--sumi-dark);
  }
  .card-desc {
    font-size: 12px;
    line-height: 1.5;
    text-align: center;
    color: #4A4641;
  }

  /* TOUCH CONTROLS */
  .mobile-touch-bar {
    position: absolute;
    bottom: 24px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    pointer-events: none;
    z-index: 20;
  }
  #joystick-base {
    width: 120px;
    height: 120px;
    background: rgba(255, 255, 255, 0.4);
    border: 2px dashed var(--border-ink);
    border-radius: 50%;
    position: relative;
    pointer-events: auto;
    touch-action: none;
    display: none;
  }
  #joystick-stick {
    width: 50px;
    height: 50px;
    background: var(--border-ink);
    border-radius: 50%;
    position: absolute;
    top: 35px;
    left: 35px;
  }
  .touch-action-btns {
    display: flex;
    gap: 14px;
    pointer-events: auto;
  }
  .touch-btn {
    width: 66px;
    height: 66px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.85);
    border: 3px solid var(--border-ink);
    box-shadow: 3px 3px 0 var(--border-ink);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-weight: 900;
    font-size: 14px;
    cursor: pointer;
  }
  .touch-btn:active {
    transform: translate(2px, 2px);
    box-shadow: 1px 1px 0 var(--border-ink);
  }
  #btn-dash { border-color: var(--cyan); color: #007D87; }
  #btn-ult { border-color: var(--gold); color: #9A7B1C; }

  /* GAME OVER / VICTORY OVERLAY */
  #gameover-screen {
    position: absolute;
    inset: 0;
    background: rgba(240, 235, 225, 0.94);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 200;
    padding: 24px;
  }
  .score-tally-box {
    background: #FFFDF9;
    border: 3px solid var(--border-ink);
    box-shadow: 6px 6px 0 var(--border-ink);
    padding: 24px;
    max-width: 420px;
    width: 100%;
    text-align: center;
    margin: 16px 0;
  }
  .tally-row {
    display: flex;
    justify-content: space-between;
    margin: 10px 0;
    font-size: 16px;
    font-weight: 700;
    border-bottom: 1px dashed #CCC;
    padding-bottom: 4px;
  }
  .total-score-row {
    font-size: 26px;
    font-weight: 900;
    color: var(--crimson);
    margin-top: 14px;
  }
  .restart-btn {
    background: var(--border-ink);
    color: #FFF;
    border: none;
    padding: 12px 34px;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--crimson);
    transition: transform 0.1s;
  }
  .restart-btn:hover {
    transform: translateY(-2px);
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <div id="hud-overlay">
    <div class="exp-wrapper">
      <div class="exp-fill" id="expFill"></div>
    </div>

    <div class="hud-top">
      <div class="vitals-box">
        <div class="bar-container">
          <span>體力</span>
          <div class="bar-bg"><div class="bar-fill-hp" id="hpFill"></div></div>
          <span id="hpText" style="font-size:11px; width:52px; text-align:right;">300/300</span>
        </div>
        <div class="bar-container">
          <span>氣力</span>
          <div class="bar-bg"><div class="bar-fill-stam" id="stamFill"></div></div>
          <span id="stamText" style="font-size:11px; width:52px; text-align:right;">100%</span>
        </div>
        <div class="bar-container">
          <span>奧義</span>
          <div class="bar-bg"><div class="bar-fill-ult" id="ultFill"></div></div>
          <span id="ultText" style="font-size:11px; width:52px; text-align:right;">0%</span>
        </div>
      </div>

      <div class="center-status">
        <div class="game-timer" id="hudTimer">00:00</div>
        <div class="hud-score-label">戰績點數: <span id="hudScore">0</span></div>
      </div>

      <div class="level-badge" id="levelBadge">階級 壹</div>
    </div>

    <div id="boss-banner">
      <span id="boss-name" style="font-weight:900; color:#FF5C7A; letter-spacing:2px;">【般若將軍・羅剎鬼徹】降臨</span>
      <div id="boss-hp-bar"><div id="boss-hp-fill"></div></div>
    </div>

    <div class="mobile-touch-bar">
      <div id="joystick-base">
        <div id="joystick-stick"></div>
      </div>
      <div class="touch-action-btns">
        <div class="touch-btn" id="btn-dash">見切<br><span style="font-size:10px;">SPACE</span></div>
        <div class="touch-btn" id="btn-ult">奧義<br><span style="font-size:10px;">E 鍵</span></div>
      </div>
    </div>
  </div>

  <!-- UPGRADE SELECTION MODAL -->
  <div id="upgrade-modal">
    <div class="upgrade-title">心法突破・奧義修得</div>
    <div class="cards-deck" id="cardsDeck"></div>
  </div>

  <!-- GAME OVER / RESULTS TALLY -->
  <div id="gameover-screen">
    <h1 style="font-size:36px; font-weight:900; letter-spacing:6px; color:var(--crimson);" id="endTitle">修羅道・力竭殞命</h1>
    <div class="score-tally-box">
      <div class="tally-row"><span>存活時間</span><span id="tallyTime">00:00</span></div>
      <div class="tally-row"><span>討伐妖魔數</span><span id="tallyKills">0 隻</span></div>
      <div class="tally-row"><span>極意【見切】次數</span><span id="tallyMikiri">0 次</span></div>
      <div class="tally-row"><span>彈反子彈數</span><span id="tallyParry">0 發</span></div>
      <div class="tally-row"><span>突破最高階級</span><span id="tallyLevel">Lv. 1</span></div>
      <div class="total-score-row"><span>最終評價得分: </span><span id="tallyFinalScore">0</span></div>
    </div>
    <button class="restart-btn" id="restartBtn">再入修羅輪迴</button>
  </div>
</div>

<script>
/* ==========================================================================
   AUDIO SYNTHESIZER (Web Audio API - Procedural)
   ========================================================================== */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.muted = false;
  }
  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    }
  }
  playSlash() {
    if (this.muted || !this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.12);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(2500, this.ctx.currentTime);
    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
    osc.connect(filter);
    filter.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.12);
  }
  playParry() {
    if (this.muted || !this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(1800, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(3200, this.ctx.currentTime + 0.08);
    gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.3);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.3);
  }
  playMikiri() {
    if (this.muted || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(440, now);
    osc.frequency.linearRampToValueAtTime(880, now + 0.25);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.5);
  }
  playHit() {
    if (this.muted || !this.ctx) return;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(140, this.ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(this.ctx.currentTime + 0.1);
  }
  playUlt() {
    if (this.muted || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.linearRampToValueAtTime(1200, now + 0.6);
    gain.gain.setValueAtTime(0.4, now);
    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);
    osc.connect(gain);
    gain.connect(this.ctx.destination);
    osc.start();
    osc.stop(now + 0.8);
  }
}
const audio = new SoundEngine();

/* ==========================================================================
   GAME ENGINE & STATE
   ========================================================================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameWidth = window.innerWidth;
let gameHeight = window.innerHeight;
function resize() {
  gameWidth = window.innerWidth;
  gameHeight = window.innerHeight;
  canvas.width = gameWidth;
  canvas.height = gameHeight;
}
window.addEventListener('resize', resize);
resize();

// Core Player Object with Beefy HP and Balanced Defenses
const player = {
  x: 0,
  y: 0,
  speed: 4.0,
  maxHp: 350,       // Beefier HP so player doesn't get one-shot
  hp: 350,
  stamina: 100,     // Stamina for rolling/mikiri
  maxStamina: 100,
  staminaRegen: 32, // Stamina per sec
  invulnerableTime: 0,
  level: 1,
  exp: 0,
  expToNext: 10,
  ultCharge: 0,
  ultMax: 100,
  facingAngle: 0,
  isMoving: false,
  dashDuration: 0,
  dashCooldown: 0,
  dashDirX: 0,
  dashDirY: 0,
  canMikiriReflect: false,
  parryShieldActive: 0, // When active, sweeps back enemy bullets
  weapons: [],
  passives: {
    might: 1.0,       // +Damage
    recovery: 1.0,    // HP regen
    haste: 1.0,       // Cooldown reduction
    area: 1.0,        // Area scale
    ironBody: 0.85    // Damage taken multiplier (default 15% armor reduction)
  }
};

let keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  audio.init();
  if (e.code === 'Space') triggerDash();
  if (e.key.toLowerCase() === 'e') triggerUltimate();
});
window.addEventListener('keyup', e => {
  keys[e.key.toLowerCase()] = false;
});

// Touch / Joystick Setup
const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
const joyBase = document.getElementById('joystick-base');
const joyStick = document.getElementById('joystick-stick');
let joyActive = false;
let joyStart = { x: 0, y: 0 };
let joyDelta = { x: 0, y: 0 };

if (isTouchDevice) {
  joyBase.style.display = 'block';
  joyBase.addEventListener('touchstart', e => {
    audio.init();
    joyActive = true;
    const t = e.touches[0];
    const rect = joyBase.getBoundingClientRect();
    joyStart = { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
  }, { passive: false });

  window.addEventListener('touchmove', e => {
    if (!joyActive) return;
    const t = e.touches[0];
    const dx = t.clientX - joyStart.x;
    const dy = t.clientY - joyStart.y;
    const dist = Math.hypot(dx, dy);
    const maxR = 40;
    const angle = Math.atan2(dy, dx);
    const clampedR = Math.min(dist, maxR);
    joyDelta = { x: (Math.cos(angle) * clampedR) / maxR, y: (Math.sin(angle) * clampedR) / maxR };
    joyStick.style.transform = `translate(${joyDelta.x * maxR}px, ${joyDelta.y * maxR}px)`;
  }, { passive: false });

  const endJoy = () => {
    joyActive = false;
    joyDelta = { x: 0, y: 0 };
    joyStick.style.transform = `translate(0, 0)`;
  };
  window.addEventListener('touchend', endJoy);
  window.addEventListener('touchcancel', endJoy);

  document.getElementById('btn-dash').addEventListener('touchstart', (e) => {
    e.preventDefault();
    audio.init();
    triggerDash();
  });
  document.getElementById('btn-ult').addEventListener('touchstart', (e) => {
    e.preventDefault();
    audio.init();
    triggerUltimate();
  });
}

// Track Game Statistics for Result Screen
let stats = {
  startTime: Date.now(),
  elapsedSeconds: 0,
  kills: 0,
  mikiriTriggers: 0,
  parriedBullets: 0,
  score: 0
};

let enemies = [];
let enemyProjectiles = []; // Bullets that can be parried/reflected!
let playerProjectiles = [];
let particles = [];
let floatingTexts = [];
let pickables = [];
let shockwaves = [];
let screenShake = 0;
let timeSlowFactor = 1.0;
let timeSlowDuration = 0;
let isPaused = false;
let isGameOver = false;

/* ==========================================================================
   WEAPONS & SKILLS REPERTOIRE
   ========================================================================== */
const ALL_UPGRADES = [
  {
    id: 'iaijutsu',
    type: 'weapon',
    name: '居合・水天一文字',
    desc: '揮斬出穿透性高階水藍水墨劍氣，對直線妖魔造成大範圍割裂。',
    level: 1,
    maxLevel: 5,
    cooldown: 1.0,
    timer: 0,
    renderPreview(ctx, t) {
      ctx.fillStyle = '#00F0FF';
      ctx.shadowColor = '#00F0FF';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      const waveX = 60 + Math.sin(t * 8) * 35;
      ctx.arc(waveX, 55, 28, -Math.PI / 3, Math.PI / 3);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#00F0FF';
      ctx.stroke();
    }
  },
  {
    id: 'ofuda',
    type: 'weapon',
    name: '破邪・業火符咒',
    desc: '祭出追蹤妖靈的鮮紅靈符，命中引發水墨爆炸，具備高擊退力。',
    level: 0,
    maxLevel: 5,
    cooldown: 1.4,
    timer: 0,
    renderPreview(ctx, t) {
      ctx.fillStyle = '#FF1E44';
      ctx.shadowColor = '#FF1E44';
      ctx.shadowBlur = 8;
      for (let i = 0; i < 3; i++) {
        const x = 40 + i * 40 + Math.sin(t * 6 + i) * 8;
        const y = 55 + Math.cos(t * 6 + i) * 12;
        ctx.fillRect(x - 6, y - 10, 12, 20);
      }
    }
  },

/* ==========================================================================
   ACTIONS: DASH & MIKIRI & ULTIMATE
   ========================================================================== */
function triggerDash() {
  if (player.dashCooldown > 0 || player.stamina < 30 || isPaused || isGameOver) return;
  player.stamina -= 30;
  player.dashDuration = 0.28;
  player.dashCooldown = 0.55;
  player.invulnerableTime = 0.32;
  player.canMikiriReflect = true;
  player.parryShieldActive = 0.3; // 0.3s parry window

  // Dash Direction
  let dx = 0, dy = 0;
  if (joyActive) {
    dx = joyDelta.x;
    dy = joyDelta.y;
  } else {
    if (keys['w'] || keys['arrowup']) dy -= 1;
    if (keys['s'] || keys['arrowdown']) dy += 1;
    if (keys['a'] || keys['arrowleft']) dx -= 1;
    if (keys['d'] || keys['arrowright']) dx += 1;
  }
  if (dx === 0 && dy === 0) {
    dx = Math.cos(player.facingAngle);
    dy = Math.sin(player.facingAngle);
  } else {
    const len = Math.hypot(dx, dy);
    dx /= len;
    dy /= len;
  }
  player.dashDirX = dx;
  player.dashDirY = dy;
  audio.playSlash();

  // Create Water-Blue ink phantom trail
  for (let i = 0; i < 4; i++) {
    particles.push({
      x: player.x - dx * i * 15,
      y: player.y - dy * i * 15,
      vx: (Math.random() - 0.5) * 30,
      vy: (Math.random() - 0.5) * 30,
      radius: 14,
      color: '#00F0FF',
      alpha: 0.6,
      decay: 2.2
    });
  }

  // Check Mikiri or Projectile Reflection
  checkMikiriReflect();
}

function checkMikiriReflect() {
  let reflectedAny = false;

  // 1. Reflect Enemy Bullets
  for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
    const p = enemyProjectiles[i];
    const dist = Math.hypot(p.x - player.x, p.y - player.y);
    if (dist < 85) {
      // REFLECT BULLET INTO PLAYER PROJECTILE!
      reflectedAny = true;
      stats.parriedBullets++;
      stats.score += 75;
      floatingTexts.push({ x: p.x, y: p.y - 20, text: '彈反！', color: '#00F0FF', life: 0.8, size: 20 });

      // Turn into deadly player projectile heading in opposite direction
      playerProjectiles.push({
        x: p.x,
        y: p.y,
        vx: -p.vx * 1.8,
        vy: -p.vy * 1.8,
        damage: 160 * player.passives.might,
        radius: 8,
        penetrate: 3,
        color: '#00F0FF',
        life: 2.0
      });

      enemyProjectiles.splice(i, 1);
    }
  }

  // 2. Trigger Mikiri on Attacking / Telegraphing Enemies
  let triggeredMikiri = false;
  enemies.forEach(e => {
    const dist = Math.hypot(e.x - player.x, e.y - player.y);
    if (dist < 110 && (e.isTelegraphing || e.state === 'attack' || e.isCharging)) {
      triggeredMikiri = true;
      e.hp -= 280 * player.passives.might;
      e.stunTimer = 1.2;
      stats.score += 150;

      // Slicing blood & ink splatter
      for (let k = 0; k < 18; k++) {
        particles.push({
          x: e.x,
          y: e.y,
          vx: (Math.random() - 0.5) * 350,
          vy: (Math.random() - 0.5) * 350,
          radius: Math.random() * 6 + 3,
          color: Math.random() > 0.4 ? '#FF1E44' : '#00F0FF',
          alpha: 1.0,
          decay: 2.0
        });
      }
    }
  });

  if (triggeredMikiri || reflectedAny) {
    stats.mikiriTriggers++;
    audio.playMikiri();
    triggerTimeSlow(0.18, 0.45); // Bullet time
    screenShake = 16;
    floatingTexts.push({ x: player.x, y: player.y - 45, text: '【見切・居合一閃】', color: '#00F0FF', life: 1.2, size: 26 });
    player.ultCharge = Math.min(player.ultMax, player.ultCharge + 15);
  }
}

function triggerUltimate() {
  if (player.ultCharge < player.ultMax || isPaused || isGameOver) return;
  player.ultCharge = 0;
  audio.playUlt();
  triggerTimeSlow(0.1, 0.7);
  screenShake = 24;

  floatingTexts.push({ x: player.x, y: player.y - 60, text: '奧義・天魔滅殺', color: '#FF1E44', life: 1.6, size: 36 });

  // Full Screen Ink Slash Wave
  enemies.forEach(e => {
    e.hp -= 650 * player.passives.might;
    e.vx = (e.x - player.x) * 0.1;
    e.vy = (e.y - player.y) * 0.1;
  });
  enemyProjectiles = []; // Clear all enemy projectiles

  for (let i = 0; i < 40; i++) {
    particles.push({
      x: player.x + (Math.random() - 0.5) * 800,
      y: player.y + (Math.random() - 0.5) * 600,
      vx: (Math.random() - 0.5) * 400,
      vy: (Math.random() - 0.5) * 400,
      radius: Math.random() * 10 + 4,
      color: Math.random() > 0.5 ? '#FF1E44' : '#00F0FF',
      alpha: 1.0,
      decay: 1.4
    });
  }
}

function triggerTimeSlow(factor, duration) {
  timeSlowFactor = factor;
  timeSlowDuration = duration;
}

/* ==========================================================================
   ENEMY TYPES WITH DISTINCT ATTACK PATTERNS
   ========================================================================== */
function spawnEnemy(type, isElite = false) {
  const angle = Math.random() * Math.PI * 2;
  const dist = Math.max(gameWidth, gameHeight) * 0.65 + Math.random() * 80;
  const x = player.x + Math.cos(angle) * dist;
  const y = player.y + Math.sin(angle) * dist;

  let baseHp = 50;
  let speed = 2.4;
  let radius = 18;
  let color = '#3A3530';

  // Base difficulty scaling by survival time
  const timeMul = 1.0 + stats.elapsedSeconds * 0.007;

  const enemy = {
    type,
    x,
    y,
    vx: 0,
    vy: 0,
    radius,
    hp: baseHp * timeMul * (isElite ? 4 : 1),
    maxHp: baseHp * timeMul * (isElite ? 4 : 1),
    speed,
    isElite,
    color,
    state: 'chase',
    stateTimer: 0,
    shootTimer: Math.random() * 2,
    telegraphAngle: 0,
    telegraphLength: 0,
    isTelegraphing: false,
    stunTimer: 0,
    dashTarget: { x: 0, y: 0 }
  };

  if (type === 'tengu') {
    // Fast flanker, shoots feather needles
    enemy.speed = 3.6;
    enemy.hp = 40 * timeMul;
    enemy.color = '#1E1D1D';
  } else if (type === 'samurai') {
    // Armored, charges with katana sweep
    enemy.speed = 2.1;
    enemy.hp = 110 * timeMul;
    enemy.color = '#382B29';
  } else if (type === 'kitsune') {
    // Ranged spirit, fires homing or spiral cyan/red fireballs
    enemy.speed = 1.9;
    enemy.hp = 65 * timeMul;
    enemy.color = '#D14836';
  } else if (type === 'oni') {
    // Massive brute, ground slam with telegraph danger zone
    enemy.speed = 1.4;
    enemy.hp = 260 * timeMul;
    enemy.radius = 28;
    enemy.color = '#7A1822';
  } else if (type === 'sorcerer') {
    // Special Pattern: Fires ring bullet barrages
    enemy.speed = 1.6;
    enemy.hp = 90 * timeMul;
    enemy.color = '#5A3D7A';
  } else if (type === 'boss_rashamon') {
    // Boss 1
    enemy.speed = 1.8;
    enemy.radius = 42;
    enemy.hp = 4200;
    enemy.maxHp = 4200;
    enemy.isBoss = true;
    enemy.name = '【般若武將・羅剎鬼徹】';
  } else if (type === 'boss_tamamo') {
    // Boss 2
    enemy.speed = 2.2;
    enemy.radius = 45;
    enemy.hp = 7800;
    enemy.maxHp = 7800;
    enemy.isBoss = true;
    enemy.name = '【九尾妖狐・玉藻之魂】';
  }

  enemies.push(enemy);
}

/* ==========================================================================
   UPGRADE & LEVEL-UP DRAFTING
   ========================================================================== */
function checkLevelUp() {
  if (player.exp >= player.expToNext) {
    player.exp -= player.expToNext;
    player.level++;
    player.expToNext = Math.floor(player.expToNext * 1.35 + 8);
    document.getElementById('levelBadge').innerText = `階級 ${toKanjiNumeral(player.level)}`;
    openUpgradeModal();
  }
}

function toKanjiNumeral(n) {
  const kanji = ['零','壹','貳','參','肆','伍','陸','柒','捌','玖','拾'];
  return kanji[n] || n;
}

let previewAnimId = null;
function openUpgradeModal() {
  isPaused = true;
  const modal = document.getElementById('upgrade-modal');
  const deck = document.getElementById('cardsDeck');
  deck.innerHTML = '';
  modal.style.display = 'flex';

  // Pick 3 random available upgrades
  const pool = ALL_UPGRADES.filter(u => u.level < u.maxLevel);
  const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, 3);

  const previewCanvases = [];

  shuffled.forEach(upgrade => {
    const card = document.createElement('div');
    card.className = 'ema-card';

    const pBox = document.createElement('div');
    pBox.className = 'preview-box';
    const pCanvas = document.createElement('canvas');
    pCanvas.className = 'preview-canvas';
    pCanvas.width = 270;
    pCanvas.height = 110;
    pBox.appendChild(pCanvas);

    const tag = document.createElement('div');
    tag.className = 'card-type-tag';
    tag.innerText = upgrade.type === 'weapon' ? '秘術' : '心法';

    const name = document.createElement('div');
    name.className = 'card-name';
    name.innerText = `${upgrade.name} (Lv.${upgrade.level + 1})`;

    const desc = document.createElement('div');
    desc.className = 'card-desc';
    desc.innerText = upgrade.desc;

    card.appendChild(tag);
    card.appendChild(pBox);
    card.appendChild(name);
    card.appendChild(desc);

    card.onclick = () => {
      selectUpgrade(upgrade);
      cancelAnimationFrame(previewAnimId);
      modal.style.display = 'none';
      isPaused = false;
    };

    deck.appendChild(card);
    previewCanvases.push({ canvas: pCanvas, ctx: pCanvas.getContext('2d'), upgrade });
  });

  // Loop animated previews inside upgrade cards
  let startTime = Date.now();
  function loopPreview() {
    const t = (Date.now() - startTime) / 1000;
    previewCanvases.forEach(item => {
      item.ctx.clearRect(0, 0, item.canvas.width, item.canvas.height);
      item.upgrade.renderPreview(item.ctx, t);
    });
    if (isPaused) {
      previewAnimId = requestAnimationFrame(loopPreview);
    }
  }
  loopPreview();
}

function selectUpgrade(upgrade) {
  upgrade.level++;
  if (upgrade.type === 'weapon') {
    if (!player.weapons.find(w => w.id === upgrade.id)) {
      player.weapons.push(upgrade);
    }
  } else {
    // Apply passives
    if (upgrade.id === 'passive_might') player.passives.might += 0.25;
    if (upgrade.id === 'passive_armor') {
      player.passives.ironBody = Math.max(0.45, player.passives.ironBody - 0.12);
      player.maxHp += 50;
      player.hp = Math.min(player.maxHp, player.hp + 60);
    }
    if (upgrade.id === 'passive_haste') {
      player.passives.haste *= 0.85;
      player.staminaRegen += 12;
    }
  }
}

/* ==========================================================================
   UPDATE LOOPS (WEAPONS, MOBS, PROJECTILES)
   ========================================================================== */
let lastFrameTime = performance.now();
let spawnTimer = 0;
let bossSpawned1 = false;
let bossSpawned2 = false;

function gameLoop(now) {
  const dt = Math.min((now - lastFrameTime) / 1000, 0.1);
  lastFrameTime = now;

  if (!isPaused && !isGameOver) {
    update(dt);
  }
  render();

  requestAnimationFrame(gameLoop);
}

function update(rawDt) {
  // Bullet-time slow motion handler
  if (timeSlowDuration > 0) {
    timeSlowDuration -= rawDt;
    if (timeSlowDuration <= 0) timeSlowFactor = 1.0;
  }
  const dt = rawDt * timeSlowFactor;

  stats.elapsedSeconds = Math.floor((Date.now() - stats.startTime) / 1000);
  const minutes = Math.floor(stats.elapsedSeconds / 60).toString().padStart(2, '0');
  const seconds = (stats.elapsedSeconds % 60).toString().padStart(2, '0');
  document.getElementById('hudTimer').innerText = `${minutes}:${seconds}`;
  document.getElementById('hudScore').innerText = stats.score;

  // 1. Player Movement & Stamina
  player.stamina = Math.min(player.maxStamina, player.stamina + player.staminaRegen * rawDt);
  if (player.dashCooldown > 0) player.dashCooldown -= rawDt;
  if (player.invulnerableTime > 0) player.invulnerableTime -= rawDt;
  if (player.parryShieldActive > 0) player.parryShieldActive -= rawDt;

  if (player.dashDuration > 0) {
    player.dashDuration -= rawDt;
    player.x += player.dashDirX * player.speed * 2.8 * 60 * rawDt;
    player.y += player.dashDirY * player.speed * 2.8 * 60 * rawDt;
    checkMikiriReflect(); // Keep sweeping parry window active during dash
  } else {
    let mx = 0, my = 0;
    if (joyActive) {
      mx = joyDelta.x;
      my = joyDelta.y;
    } else {
      if (keys['w'] || keys['arrowup']) my -= 1;
      if (keys['s'] || keys['arrowdown']) my += 1;
      if (keys['a'] || keys['arrowleft']) mx -= 1;
      if (keys['d'] || keys['arrowright']) mx += 1;
    }

    if (mx !== 0 || my !== 0) {
      const len = Math.hypot(mx, my);
      mx /= len;
      my /= len;
      player.x += mx * player.speed * 60 * dt;
      player.y += my * player.speed * 60 * dt;
      player.facingAngle = Math.atan2(my, mx);
      player.isMoving = true;
    } else {
      player.isMoving = false;
    }
  }

  // 2. High Swarm Monster Spawning Logic (Lots of mobs)
  spawnTimer += dt;
  const targetMobCount = 35 + Math.min(110, stats.elapsedSeconds * 0.9);
  if (enemies.length < targetMobCount && spawnTimer > 0.25) {
    spawnTimer = 0;
    const roll = Math.random();
    if (roll < 0.3) spawnEnemy('tengu');
    else if (roll < 0.6) spawnEnemy('samurai');
    else if (roll < 0.8) spawnEnemy('kitsune');
    else if (roll < 0.93) spawnEnemy('oni');
    else spawnEnemy('sorcerer');
  }

  // Boss Spawns
  if (stats.elapsedSeconds >= 60 && !bossSpawned1) {
    bossSpawned1 = true;
    spawnEnemy('boss_rashamon');
    showBossBanner('【般若將軍・羅剎鬼徹】現世！');
  }
  if (stats.elapsedSeconds >= 150 && !bossSpawned2) {
    bossSpawned2 = true;
    spawnEnemy('boss_tamamo');
    showBossBanner('【九尾妖狐・玉藻之魂】禍亂人間！');
  }

  // 3. Weapons Auto-Trigger
  updateWeapons(dt);

  // 4. Update Enemy Projectiles & Bullets
  updateEnemyProjectiles(dt);

  // 5. Update Player Projectiles
  updatePlayerProjectiles(dt);

  // 6. Update Enemies & Behaviors
  updateEnemies(dt);

  // 7. Pickables & HUD Updates
  updatePickables(dt);
  updateFloatingText(dt);
  updateParticles(dt);
  checkLevelUp();

  // Update HUD Bars
  const hpPercent = Math.max(0, (player.hp / player.maxHp) * 100);
  document.getElementById('hpFill').style.width = `${hpPercent}%`;
  document.getElementById('hpText').innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;

  const stamPercent = Math.max(0, (player.stamina / player.maxStamina) * 100);
  document.getElementById('stamFill').style.width = `${stamPercent}%`;
  document.getElementById('stamText').innerText = `${Math.floor(stamPercent)}%`;

  const ultPercent = Math.max(0, (player.ultCharge / player.ultMax) * 100);
  document.getElementById('ultFill').style.width = `${ultPercent}%`;
  document.getElementById('ultText').innerText = `${Math.floor(ultPercent)}%`;

  const expPercent = Math.max(0, (player.exp / player.expToNext) * 100);
  document.getElementById('expFill').style.width = `${expPercent}%`;

  // Natural passive HP recovery
  player.hp = Math.min(player.maxHp, player.hp + 1.8 * player.passives.recovery * dt);

  // Check Death
  if (player.hp <= 0 && !isGameOver) {
    triggerGameOver();
  }
}

function showBossBanner(name) {
  const b = document.getElementById('boss-banner');
  document.getElementById('boss-name').innerText = name;
  b.style.display = 'flex';
}

/* ==========================================================================
   WEAPONS UPDATE LOGIC
   ========================================================================== */
function updateWeapons(dt) {
  player.weapons.forEach(w => {
    w.timer += dt;
    const effCooldown = w.cooldown * player.passives.haste;

    if (w.id === 'iaijutsu' && w.timer >= effCooldown) {
      w.timer = 0;
      audio.playSlash();
      // Wave slash forward towards nearest enemy or facing angle
      let targetAngle = player.facingAngle;
      const nearest = getNearestEnemy();
      if (nearest) targetAngle = Math.atan2(nearest.y - player.y, nearest.x - player.x);

      playerProjectiles.push({
        type: 'iaijutsu',
        x: player.x,
        y: player.y,
        vx: Math.cos(targetAngle) * 480,
        vy: Math.sin(targetAngle) * 480,
        damage: (65 + w.level * 22) * player.passives.might,
        radius: 35 * player.passives.area,
        penetrate: 6 + w.level,
        color: '#00F0FF',
        life: 0.8
      });
    }

    if (w.id === 'ofuda' && w.timer >= effCooldown) {
      w.timer = 0;
      const targets = getNearestEnemies(2 + w.level);
      targets.forEach(t => {
        const ang = Math.atan2(t.y - player.y, t.x - player.x);
        playerProjectiles.push({
          type: 'ofuda',
          x: player.x,
          y: player.y,
          vx: Math.cos(ang) * 380,
          vy: Math.sin(ang) * 380,
          target: t,
          damage: (45 + w.level * 18) * player.passives.might,
          radius: 12,
          penetrate: 1,
          color: '#FF1E44',
          life: 1.8
        });
      });
    }

    if (w.id === 'sakura') {
      // Passive orbital ring, tick damages close enemies
      const r = 80 * player.passives.area;
      enemies.forEach(e => {
        const d = Math.hypot(e.x - player.x, e.y - player.y);
        if (d < r + e.radius) {
          e.hp -= (28 + w.level * 8) * player.passives.might * dt;
        }
      });
    }

    if (w.id === 'thunder' && w.timer >= effCooldown) {
      w.timer = 0;
      const eliteOrNearest = enemies.find(e => e.isBoss) || enemies.find(e => e.isElite) || getNearestEnemy();
      if (eliteOrNearest) {
        audio.playHit();
        eliteOrNearest.hp -= (180 + w.level * 60) * player.passives.might;
        screenShake = 8;
        // Thunder ink explosion
        for (let i = 0; i < 16; i++) {
          particles.push({
            x: eliteOrNearest.x,
            y: eliteOrNearest.y,
            vx: (Math.random() - 0.5) * 200,
            vy: (Math.random() - 0.5) * 200,
            radius: 5,
            color: '#FF1E44',
            alpha: 1,
            decay: 2.5
          });
        }
      }
    }

    if (w.id === 'caltrop' && w.timer >= effCooldown) {
      w.timer = 0;
      pickables.push({
        type: 'caltrop',
        x: player.x,
        y: player.y,
        life: 6.0,
        damage: (35 + w.level * 15) * player.passives.might
      });
    }
  });
}

function getNearestEnemy() {
  let near = null, minDist = Infinity;
  enemies.forEach(e => {
    const d = Math.hypot(e.x - player.x, e.y - player.y);
    if (d < minDist) {
      minDist = d;
      near = e;
    }
  });
  return near;
}

function getNearestEnemies(count) {
  return [...enemies].sort((a, b) => {
    const da = Math.hypot(a.x - player.x, a.y - player.y);
    const db = Math.hypot(b.x - player.x, b.y - player.y);
    return da - db;
  }).slice(0, count);
}

/* ==========================================================================
   ENEMY BEHAVIORS & SPECIAL ATTACK MODES
   ========================================================================== */
function updateEnemies(dt) {
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];

    if (e.stunTimer > 0) {
      e.stunTimer -= dt;
      continue;
    }

    const distToPlayer = Math.hypot(player.x - e.x, player.y - e.y);
    const angleToPlayer = Math.atan2(player.y - e.y, player.x - e.x);

    // Dynamic Attack Modes
    if (e.type === 'tengu') {
      // Fast swooper that shoots feather needles at interval
      e.shootTimer -= dt;
      if (e.shootTimer <= 0 && distToPlayer < 450) {
        e.shootTimer = 2.4;
        enemyProjectiles.push({
          x: e.x,
          y: e.y,
          vx: Math.cos(angleToPlayer) * 260,
          vy: Math.sin(angleToPlayer) * 260,
          damage: 22,
          radius: 6,
          color: '#1E1D1D'
        });
      }
      e.x += Math.cos(angleToPlayer) * e.speed * 60 * dt;
      e.y += Math.sin(angleToPlayer) * e.speed * 60 * dt;
    }

    else if (e.type === 'samurai') {
      // Katana dash charge with red telegraph line
      e.shootTimer -= dt;
      if (e.state === 'chase') {
        e.x += Math.cos(angleToPlayer) * e.speed * 60 * dt;
        e.y += Math.sin(angleToPlayer) * e.speed * 60 * dt;
        if (e.shootTimer <= 0 && distToPlayer < 220) {
          e.state = 'telegraph';
          e.stateTimer = 0.6; // Telegraph warning window
          e.isTelegraphing = true;
          e.telegraphAngle = angleToPlayer;
          e.dashTarget = { x: player.x, y: player.y };
        }
      } else if (e.state === 'telegraph') {
        e.stateTimer -= dt;
        if (e.stateTimer <= 0) {
          e.state = 'charge';
          e.stateTimer = 0.25;
          e.isTelegraphing = false;
        }
      } else if (e.state === 'charge') {
        e.stateTimer -= dt;
        e.x += Math.cos(e.telegraphAngle) * e.speed * 3.8 * 60 * dt;
        e.y += Math.sin(e.telegraphAngle) * e.speed * 3.8 * 60 * dt;
        if (e.stateTimer <= 0) {
          e.state = 'chase';
          e.shootTimer = 3.0;
        }
      }
    }

    else if (e.type === 'kitsune') {
      // Spirits that keep distance and fire homing cyan fireballs
      if (distToPlayer < 180) {
        // Back off
        e.x -= Math.cos(angleToPlayer) * e.speed * 60 * dt;
        e.y -= Math.sin(angleToPlayer) * e.speed * 60 * dt;
      } else {
        e.x += Math.cos(angleToPlayer) * e.speed * 0.7 * 60 * dt;
        e.y += Math.sin(angleToPlayer) * e.speed * 0.7 * 60 * dt;
      }
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        e.shootTimer = 2.8;
        // Fire 2 spiraling spirit bullets
        for (let s = -1; s <= 1; s += 2) {
          const spread = angleToPlayer + s * 0.25;
          enemyProjectiles.push({
            x: e.x,
            y: e.y,
            vx: Math.cos(spread) * 190,
            vy: Math.sin(spread) * 190,
            damage: 26,
            radius: 8,
            color: '#00F0FF'
          });
        }
      }
    }

    else if (e.type === 'oni') {
      // Big Brute: charges ground smash shockwave (danger circle)
      e.shootTimer -= dt;
      if (e.state === 'chase') {
        e.x += Math.cos(angleToPlayer) * e.speed * 60 * dt;
        e.y += Math.sin(angleToPlayer) * e.speed * 60 * dt;
        if (e.shootTimer <= 0 && distToPlayer < 160) {
          e.state = 'smash_windup';
          e.stateTimer = 0.8; // Dangerous red circle telegraph
          e.isTelegraphing = true;
        }
      } else if (e.state === 'smash_windup') {
        e.stateTimer -= dt;
        if (e.stateTimer <= 0) {
          e.state = 'chase';
          e.shootTimer = 4.0;
          e.isTelegraphing = false;
          // Spawn expanding ground smash shockwave
          shockwaves.push({
            x: e.x,
            y: e.y,
            radius: 10,
            maxRadius: 110,
            damage: 48,
            color: '#FF1E44'
          });
          audio.playHit();
          screenShake = 12;
        }
      }
    }

    else if (e.type === 'sorcerer') {
      // Ring bullet fan caster
      e.x += Math.cos(angleToPlayer) * e.speed * 60 * dt;
      e.y += Math.sin(angleToPlayer) * e.speed * 60 * dt;
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        e.shootTimer = 3.6;
        for (let a = 0; a < 8; a++) {
          const ringAng = (Math.PI * 2 / 8) * a;
          enemyProjectiles.push({
            x: e.x,
            y: e.y,
            vx: Math.cos(ringAng) * 150,
            vy: Math.sin(ringAng) * 150,
            damage: 20,
            radius: 6,
            color: '#D4AF37'
          });
        }
      }
    }

    else if (e.isBoss) {
      // Multi-phase Boss: Bullet hell + Charge Slashes
      e.x += Math.cos(angleToPlayer) * e.speed * 60 * dt;
      e.y += Math.sin(angleToPlayer) * e.speed * 60 * dt;
      e.shootTimer -= dt;
      if (e.shootTimer <= 0) {
        e.shootTimer = 2.0;
        // Radial bullet fan
        for (let k = -2; k <= 2; k++) {
          const fanAng = angleToPlayer + k * 0.22;
          enemyProjectiles.push({
            x: e.x,
            y: e.y,
            vx: Math.cos(fanAng) * 220,
            vy: Math.sin(fanAng) * 220,
            damage: 32,
            radius: 9,
            color: '#FF1E44'
          });
        }
      }
      // Update Boss HP Bar in HUD
      const fill = document.getElementById('boss-hp-fill');
      if (fill) fill.style.width = `${Math.max(0, (e.hp / e.maxHp) * 100)}%`;
    }

    // Direct Body Collision with player (Mitigated by ironBody passive)
    if (distToPlayer < player.radius + e.radius && player.invulnerableTime <= 0) {
      const rawDmg = (e.isBoss ? 45 : 22);
      const actualDmg = rawDmg * player.passives.ironBody;
      player.hp -= actualDmg;
      player.invulnerableTime = 0.45;
      audio.playHit();
      screenShake = 6;
      floatingTexts.push({ x: player.x, y: player.y - 30, text: `-${Math.round(actualDmg)}`, color: '#FF1E44', life: 0.8, size: 18 });
    }

    // Caltrops check
    pickables.forEach(pk => {
      if (pk.type === 'caltrop') {
        if (Math.hypot(e.x - pk.x, e.y - pk.y) < 35) {
          e.hp -= pk.damage * dt;
          e.x -= Math.cos(angleToPlayer) * 1.5;
          e.y -= Math.sin(angleToPlayer) * 1.5;
        }
      }
    });

    // Check Death
    if (e.hp <= 0) {
      stats.kills++;
      stats.score += e.isBoss ? 2000 : (e.isElite ? 250 : 50);
      player.ultCharge = Math.min(player.ultMax, player.ultCharge + (e.isBoss ? 50 : 4));

      // Drop Experience Magatama
      pickables.push({
        type: 'magatama',
        x: e.x,
        y: e.y,
        exp: e.isBoss ? 120 : (e.isElite ? 35 : 10)
      });

      // Death ink particles
      for (let p = 0; p < (e.isBoss ? 40 : 12); p++) {
        particles.push({
          x: e.x,
          y: e.y,
          vx: (Math.random() - 0.5) * 240,
          vy: (Math.random() - 0.5) * 240,
          radius: Math.random() * 6 + 2,
          color: Math.random() > 0.4 ? '#FF1E44' : '#1E1D1D',
          alpha: 1.0,
          decay: 1.8
        });
      }

      if (e.isBoss) {
        document.getElementById('boss-banner').style.display = 'none';
        floatingTexts.push({ x: e.x, y: e.y - 50, text: '【首領討伐・大成】', color: '#D4AF37', life: 2.0, size: 34 });
      }

      enemies.splice(i, 1);
    }
  }
}

/* ==========================================================================
   ENEMY PROJECTILES & PARRIES
   ========================================================================== */
function updateEnemyProjectiles(dt) {
  for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
    const p = enemyProjectiles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // Check hit on player
    const dist = Math.hypot(p.x - player.x, p.y - player.y);
    if (dist < p.radius + 14) {
      if (player.dashDuration > 0 || player.invulnerableTime > 0) {
        // Automatically parried/deflected while dashing!
        stats.parriedBullets++;
        stats.score += 80;
        audio.playParry();
        floatingTexts.push({ x: p.x, y: p.y - 15, text: '彈反！', color: '#00F0FF', life: 0.8, size: 20 });

        // Turn projectile into player's reflected missile
        playerProjectiles.push({
          x: p.x,
          y: p.y,
          vx: -p.vx * 1.6,
          vy: -p.vy * 1.6,
          damage: 150 * player.passives.might,
          radius: 8,
          penetrate: 2,
          color: '#00F0FF',
          life: 2.0
        });
        enemyProjectiles.splice(i, 1);
        continue;
      } else {
        // Player takes hit with armor mitigation (no one-shots)
        const dmg = p.damage * player.passives.ironBody;
        player.hp -= dmg;
        audio.playHit();
        screenShake = 5;
        floatingTexts.push({ x: player.x, y: player.y - 25, text: `-${Math.round(dmg)}`, color: '#FF1E44', life: 0.8, size: 16 });
        enemyProjectiles.splice(i, 1);
        continue;
      }
    }

    // Discard far projectiles
    if (Math.hypot(p.x - player.x, p.y - player.y) > 1200) {
      enemyProjectiles.splice(i, 1);
    }
  }

  // Shockwaves
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.radius += 180 * dt;
    const dist = Math.hypot(sw.x - player.x, sw.y - player.y);
    if (Math.abs(dist - sw.radius) < 18 && player.invulnerableTime <= 0) {
      const dmg = sw.damage * player.passives.ironBody;
      player.hp -= dmg;
      player.invulnerableTime = 0.4;
      audio.playHit();
      floatingTexts.push({ x: player.x, y: player.y - 25, text: `-${Math.round(dmg)}`, color: '#FF1E44', life: 0.8, size: 20 });
    }
    if (sw.radius >= sw.maxRadius) {
      shockwaves.splice(i, 1);
    }
  }
}

/* ==========================================================================
   PLAYER PROJECTILES
   ========================================================================== */
function updatePlayerProjectiles(dt) {
  for (let i = playerProjectiles.length - 1; i >= 0; i--) {
    const p = playerProjectiles[i];
    p.life -= dt;
    p.x += p.vx * dt;
    p.y += p.vy * dt;

    // Check hit on enemies
    enemies.forEach(e => {
      if (p.penetrate <= 0) return;
      const d = Math.hypot(p.x - e.x, p.y - e.y);
      if (d < p.radius + e.radius) {
        e.hp -= p.damage;
        p.penetrate--;

        // Critical ink splash
        for (let k = 0; k < 6; k++) {
          particles.push({
            x: e.x,
            y: e.y,
            vx: (Math.random() - 0.5) * 160,
            vy: (Math.random() - 0.5) * 160,
            radius: 4,
            color: p.color,
            alpha: 1,
            decay: 2.2
          });
        }
      }
    });

    if (p.life <= 0 || p.penetrate <= 0) {
      playerProjectiles.splice(i, 1);
    }
  }
}

/* ==========================================================================
   PICKABLES & PARTICLES
   ========================================================================== */
function updatePickables(dt) {
  for (let i = pickables.length - 1; i >= 0; i--) {
    const item = pickables[i];

    if (item.type === 'caltrop') {
      item.life -= dt;
      if (item.life <= 0) pickables.splice(i, 1);
      continue;
    }

    // Magatama Exp Orb magnet
    const dist = Math.hypot(player.x - item.x, player.y - item.y);
    if (dist < 180) {
      const angle = Math.atan2(player.y - item.y, player.x - item.x);
      item.x += Math.cos(angle) * 350 * dt;
      item.y += Math.sin(angle) * 350 * dt;
    }

    if (dist < 26) {
      player.exp += item.exp;
      stats.score += item.exp * 2;
      pickables.splice(i, 1);
    }
  }
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.alpha -= p.decay * dt;
    if (p.alpha <= 0) particles.splice(i, 1);
  }
}

function updateFloatingText(dt) {
  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const f = floatingTexts[i];
    f.life -= dt;
    f.y -= 25 * dt;
    if (f.life <= 0) floatingTexts.splice(i, 1);
  }
}

/* ==========================================================================
   GAME OVER & FINAL SCORE TALLY CALCULATION
   ========================================================================== */
function triggerGameOver() {
  isGameOver = true;
  document.getElementById('gameover-screen').style.display = 'flex';

  const m = Math.floor(stats.elapsedSeconds / 60).toString().padStart(2, '0');
  const s = (stats.elapsedSeconds % 60).toString().padStart(2, '0');

  document.getElementById('tallyTime').innerText = `${m}:${s}`;
  document.getElementById('tallyKills').innerText = `${stats.kills} 隻`;
  document.getElementById('tallyMikiri').innerText = `${stats.mikiriTriggers} 次`;
  document.getElementById('tallyParry').innerText = `${stats.parriedBullets} 發`;
  document.getElementById('tallyLevel').innerText = `Lv. ${player.level}`;

  // Comprehensive Final Score Calculation
  const finalScore = stats.score 
    + (stats.elapsedSeconds * 20) 
    + (stats.kills * 45) 
    + (stats.mikiriTriggers * 200) 
    + (stats.parriedBullets * 120)
    + (player.level * 300);

  document.getElementById('tallyFinalScore').innerText = finalScore.toLocaleString();
}

document.getElementById('restartBtn').onclick = () => {
  window.location.reload();
};

/* ==========================================================================
   RENDER SYSTEM (JAPANESE OFF-WHITE INK AESTHETIC)
   ========================================================================== */
function render() {
  ctx.save();

  // Screen Shake
  if (screenShake > 0) {
    const sx = (Math.random() - 0.5) * screenShake;
    const sy = (Math.random() - 0.5) * screenShake;
    ctx.translate(sx, sy);
    screenShake = Math.max(0, screenShake - 0.8);
  }

  ctx.clearRect(0, 0, gameWidth, gameHeight);

  // Camera Follow
  const camX = gameWidth / 2 - player.x;
  const camY = gameHeight / 2 - player.y;
  ctx.translate(camX, camY);

  // 1. Draw Washi Paper Tatami / Zen Garden Grid
  drawZenBackground();

  // 2. Draw Pickables & Ground Caltrops
  drawPickables();

  // 3. Draw Danger Telegraphs (Red Warning Circles & Charge Lines)
  drawTelegraphs();

  // 4. Draw Enemies
  drawEnemies();

  // 5. Draw Projectiles (Player & Enemy)
  drawProjectiles();

  // 6. Draw Player (Handsome Ronin Lone Wolf)
  drawPlayer();

  // 7. Draw Shockwaves & Particles
  drawShockwaves();
  drawParticles();

  // 8. Draw Floating Kanji Texts
  drawFloatingTexts();

  ctx.restore();
}

function drawZenBackground() {
  const gridSize = 120;
  const startX = Math.floor((player.x - gameWidth) / gridSize) * gridSize;
  const endX = Math.floor((player.x + gameWidth) / gridSize) * gridSize;
  const startY = Math.floor((player.y - gameHeight) / gridSize) * gridSize;
  const endY = Math.floor((player.y + gameHeight) / gridSize) * gridSize;

  ctx.strokeStyle = '#E0DAD0';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = startX; x <= endX; x += gridSize) {
    ctx.moveTo(x, startY);
    ctx.lineTo(x, endY);
  }
  for (let y = startY; y <= endY; y += gridSize) {
    ctx.moveTo(startX, y);
    ctx.lineTo(endX, y);
  }
  ctx.stroke();
}

function drawTelegraphs() {
  enemies.forEach(e => {
    if (e.isTelegraphing) {
      if (e.type === 'samurai') {
        // Red Charge Line
        ctx.strokeStyle = 'rgba(255, 30, 68, 0.55)';
        ctx.lineWidth = 14;
        ctx.beginPath();
        ctx.moveTo(e.x, e.y);
        ctx.lineTo(e.x + Math.cos(e.telegraphAngle) * 260, e.y + Math.sin(e.telegraphAngle) * 260);
        ctx.stroke();
      } else if (e.type === 'oni') {
        // Red Smash Circle
        ctx.fillStyle = 'rgba(255, 30, 68, 0.2)';
        ctx.strokeStyle = '#FF1E44';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(e.x, e.y, 110, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
      }
    }
  });
}

function drawEnemies() {
  enemies.forEach(e => {
    ctx.save();
    ctx.translate(e.x, e.y);

    if (e.type === 'tengu') {
      // Tengu Crow Mask & Feathered Wings
      ctx.fillStyle = '#1E1D1D';
      ctx.beginPath();
      ctx.ellipse(-14, 0, 14, 6, -0.3, 0, Math.PI * 2);
      ctx.ellipse(14, 0, 14, 6, 0.3, 0, Math.PI * 2);
      ctx.fill();
      // Body & Mask
      ctx.beginPath();
      ctx.arc(0, 0, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FF1E44';
      ctx.fillRect(0, -3, 8, 4); // Red beak / nose
    }

    else if (e.type === 'samurai') {
      // Conical Hat & Armor Sashimono
      ctx.fillStyle = '#382B29';
      ctx.beginPath();
      ctx.arc(0, 0, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FF1E44';
      ctx.beginPath();
      ctx.arc(-4, -2, 2.5, 0, Math.PI * 2);
      ctx.arc(4, -2, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    else if (e.type === 'kitsune') {
      // Mask & 3 Swirling Cyan Tails
      ctx.fillStyle = 'rgba(0, 240, 255, 0.6)';
      for (let t = -1; t <= 1; t++) {
        ctx.beginPath();
        ctx.ellipse(t * 12, 14, 6, 14, t * 0.4, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.fillStyle = '#FFF';
      ctx.beginPath();
      ctx.arc(0, 0, 12, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#FF1E44';
      ctx.fillRect(-6, -4, 4, 3);
      ctx.fillRect(2, -4, 4, 3);
    }

    else if (e.type === 'oni') {
      // Big Red Oni with Horns
      ctx.fillStyle = '#7A1822';
      ctx.beginPath();
      ctx.arc(0, 0, 24, 0, Math.PI * 2);
      ctx.fill();
      // Horns
      ctx.fillStyle = '#D4AF37';
      ctx.beginPath();
      ctx.moveTo(-10, -20); ctx.lineTo(-14, -34); ctx.lineTo(-4, -22);
      ctx.moveTo(10, -20); ctx.lineTo(14, -34); ctx.lineTo(4, -22);
      ctx.fill();
    }

    else if (e.isBoss) {
      // Imposing Golden Horns & Demonic Crown
      ctx.fillStyle = '#1E1D1D';
      ctx.beginPath();
      ctx.arc(0, 0, 36, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#FF1E44';
      ctx.lineWidth = 4;
      ctx.stroke();

      ctx.fillStyle = '#D4AF37';
      ctx.font = 'bold 24px serif';
      ctx.textAlign = 'center';
      ctx.fillText('鬼', 0, 8);
    }

    else {
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.arc(0, 0, e.radius, 0, Math.PI * 2);
      ctx.fill();
    }

    // Health Bar for Elite / Big Enemies
    if (e.hp < e.maxHp) {
      const bw = e.radius * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.fillRect(-bw/2, -e.radius - 10, bw, 4);
      ctx.fillStyle = '#FF1E44';
      ctx.fillRect(-bw/2, -e.radius - 10, bw * (e.hp / e.maxHp), 4);
    }

    ctx.restore();
  });
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);

  // Rotate facing angle
  ctx.rotate(player.facingAngle);

  // Flowing Ink Haori Coat (Charcoal)
  ctx.fillStyle = '#1E1D1D';
  ctx.beginPath();
  ctx.ellipse(-6, 0, 16, 12, 0, 0, Math.PI * 2);
  ctx.fill();

  // Ronin Scarf & Crimson Belt
  ctx.fillStyle = '#FF1E44';
  ctx.fillRect(-4, -10, 6, 20);

  // Head & Ponytail
  ctx.fillStyle = '#2B2A29';
  ctx.beginPath();
  ctx.arc(4, 0, 9, 0, Math.PI * 2);
  ctx.fill();

  // Katana Scabbard
  ctx.strokeStyle = '#D4AF37';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(-10, 12);
  ctx.lineTo(8, 12);
  ctx.stroke();

  // Active Parry Shield Indicator
  if (player.dashDuration > 0 || player.invulnerableTime > 0) {
    ctx.strokeStyle = '#00F0FF';
    ctx.shadowColor = '#00F0FF';
    ctx.shadowBlur = 14;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(0, 0, 28, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.restore();
}

function drawProjectiles() {
  // 1. Enemy Bullets
  enemyProjectiles.forEach(p => {
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 2. Player Projectiles
  playerProjectiles.forEach(p => {
    ctx.save();
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawPickables() {
  pickables.forEach(pk => {
    if (pk.type === 'magatama') {
      ctx.save();
      ctx.fillStyle = '#00F0FF';
      ctx.shadowColor = '#00F0FF';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(pk.x, pk.y, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    } else if (pk.type === 'caltrop') {
      ctx.fillStyle = '#1E1D1D';
      ctx.beginPath();
      ctx.arc(pk.x, pk.y, 5, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

function drawShockwaves() {
  shockwaves.forEach(sw => {
    ctx.save();
    ctx.strokeStyle = sw.color;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  });
}

function drawParticles() {
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
}

function drawFloatingTexts() {
  floatingTexts.forEach(f => {
    ctx.save();
    ctx.globalAlpha = Math.max(0, f.life);
    ctx.fillStyle = f.color;
    ctx.font = `bold ${f.size || 20}px 'Hiragino Mincho ProN', serif`;
    ctx.textAlign = 'center';
    ctx.shadowColor = 'rgba(0,0,0,0.4)';
    ctx.shadowBlur = 4;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  });
}

// Start Main Animation Frame Loop
requestAnimationFrame(gameLoop);
</script>
